<title>Cardpick</title>
<meta name="description" content="Interactive prototype: which of your credit cards to use, on which travel platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap">
<style>
/* Layout: mobile-first single column (390px target); desktop home becomes an asymmetric 1fr / 360px split with the wallet as a side rail. */
:root{
  color-scheme: light;
  --canvas:#F7F7F4; --surface:#FFFFFF; --ink:#111111; --ink-2:#686868; --muted:#989898;
  --border:#E7E7E3; --soft:#F1F1EE;
  --action:#111111; --on-action:#FFFFFF;
  --rec:#3157F5; --rec-soft:#EEF2FF;
  --pos:#18794E; --pos-soft:#EEF8F2;
  --warn:#A15C00; --warn-soft:#FFF7E8; --danger:#B42318;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-btn:11px; --r-card:15px; --r-hero:22px;
  --spring: cubic-bezier(.34,1.25,.64,1);
  --ease: cubic-bezier(.2,.8,.2,1);
  --gutter:16px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;overflow-x:clip;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--rec);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-0.035em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.muted{color:var(--ink-2)}
.i{width:1em;height:1em;stroke-width:1.75;vertical-align:-0.14em;flex:none}

#app{position:relative;min-height:100vh}
.screen{min-height:100vh;padding-inline:var(--gutter);padding-block:0 120px;animation:screenIn .32s var(--ease) backwards}
.screen.leaving{animation:screenOut .18s ease both;position:absolute;inset:0;pointer-events:none}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes screenOut{to{opacity:0;transform:translateY(-6px)}}
.wrap{max-width:440px;margin-inline:auto}
.wrap-wide{max-width:1180px;margin-inline:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding-inline:20px;border-radius:var(--r-btn);background:var(--action);color:var(--on-action);font-weight:600;font-size:15.5px;letter-spacing:-0.01em;white-space:nowrap;transition:transform .15s var(--ease),background .2s}
.btn:hover{background:#000}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{height:40px;font-size:14px;padding-inline:14px;border-radius:10px}
.btn[disabled]{background:#cfcfca;cursor:not-allowed}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px;border-bottom:1px solid currentColor;padding-bottom:1px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:650;font-size:17px;letter-spacing:-0.02em}
.brand-mark{position:relative;width:22px;height:18px}
.brand-mark span{position:absolute;width:16px;height:12px;border-radius:3px}
.brand-mark span:first-child{left:0;top:0;background:var(--rec);transform:rotate(-8deg)}
.brand-mark span:last-child{right:0;bottom:0;background:var(--ink)}
.iconbtn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:18px}
.iconbtn:hover{background:var(--soft)}

/* ---------- credit card visual ---------- */
.cc{position:relative;container-type:inline-size;width:var(--w,280px);aspect-ratio:1.586;border-radius:calc(var(--w,280px) * .055);background:var(--bg);color:var(--fg);overflow:hidden;flex:none;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 10px 24px -14px rgba(17,17,17,.45),0 2px 4px -2px rgba(17,17,17,.2);user-select:none;-webkit-user-select:none}
.cc::before{content:"";position:absolute;inset:0;background:var(--art)}
.cc::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.13) 45%,transparent 60%);transform:translateX(-60%);transition:transform .9s var(--ease)}
.cc:hover::after{transform:translateX(60%)}
.cc-in{position:absolute;inset:0;padding:7.5cqw 8cqw;display:flex;flex-direction:column;justify-content:space-between}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4cqw}
.cc-bank{font-size:5.4cqw;font-weight:650;letter-spacing:.12em;text-transform:uppercase;line-height:1}
.cc-name{font-size:6.2cqw;font-weight:500;letter-spacing:-0.01em;opacity:.92;line-height:1;text-align:right}
.cc-chip{width:13cqw;height:10cqw;border-radius:2cqw;background:linear-gradient(135deg,#e9d39b,#b99652 55%,#e0c584);box-shadow:inset 0 0 0 .5cqw rgba(0,0,0,.12);position:relative}
.cc-chip::before{content:"";position:absolute;inset:30% 0;border-block:.5cqw solid rgba(0,0,0,.18)}
.cc-bot{display:flex;justify-content:space-between;align-items:flex-end}
.cc-num{font-size:5.6cqw;letter-spacing:.14em;font-variant-numeric:tabular-nums;opacity:.85}
.net-visa{font-size:8.4cqw;font-weight:800;font-style:italic;letter-spacing:-0.02em;line-height:.8}
.net-mc{display:flex}.net-mc i{width:9cqw;height:9cqw;border-radius:50%;display:block}
.net-mc i:first-child{background:#eb001b}.net-mc i:last-child{background:#f79e1b;margin-left:-3.6cqw;mix-blend-mode:screen;opacity:.95}
.net-amex{font-size:4.6cqw;font-weight:800;letter-spacing:.06em;border:.5cqw solid currentColor;padding:.6cqw 1.4cqw;border-radius:.8cqw}
.net-diners{font-size:4.6cqw;font-weight:700;letter-spacing:.04em}
.cc.mini .cc-chip,.cc.mini .cc-num{display:none}
.cc.mini .cc-in{padding:9cqw 10cqw}
.cc.mini .cc-bank{font-size:12cqw;letter-spacing:.06em}
.cc.mini .cc-name{display:none}
.cc.mini .net-visa{font-size:15cqw}.cc.mini .net-amex{font-size:9cqw}

/* ---------- OTA mark ---------- */
.ota{--s:40px;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .26);display:inline-grid;place-items:center;flex:none;border:1px solid var(--border);background:#fff;overflow:hidden;font-weight:800}
.ota--mmt b{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#e5262c;font-size:calc(var(--s) * .5);letter-spacing:-0.06em;transform:translateY(-4%)}
.ota--ct{background:#f26b21;border-color:#f26b21;color:#fff}
.ota svg{width:calc(var(--s) * .56);height:calc(var(--s) * .56);flex:none}
.ota--ct svg{stroke-width:3.2}
.ota--emt svg{color:#1f74e8;fill:#cfe3ff;stroke-width:1.9;transform:rotate(-8deg) translateX(-4%)}
.ota--yt{background:#e1202a;border-color:#e1202a;color:#fff}
.ota--yt b{font-size:calc(var(--s) * .56);letter-spacing:-0.05em;transform:translateY(-6%)}
.ota-name{font-weight:600;letter-spacing:-0.015em}

/* ---------- SCREEN 0: AD ---------- */
.ad-stage{display:flex;flex-direction:column;align-items:center;padding-block:28px 40px;gap:14px}
.ad-ctx{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.ig{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.ig-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ig-ava{width:34px;height:34px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.ig-ava .brand-mark{transform:scale(.8)}
.ig-ava .brand-mark span:last-child{background:#fff}
.ig-who{flex:1;line-height:1.2}.ig-who b{font-size:14px;font-weight:600}.ig-who small{display:block;font-size:12px;color:var(--ink-2)}
.ig-media{position:relative;aspect-ratio:4/5;background:#ECECE6;overflow:hidden;display:flex;flex-direction:column;padding:24px 22px 14px}
.ad-copy{flex:none}
.ad-copy h2{font-size:34px;line-height:1.02;letter-spacing:-0.045em}
.ad-copy h2 em{font-style:normal;color:var(--rec)}
.ad-copy p{margin-top:12px;font-size:14.5px;color:#3d3d3a;max-width:28ch}
.ad-vis{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px}
.ad-otas{display:flex;gap:10px;justify-content:center}
.ad-otas .ota{--s:34px;box-shadow:0 6px 14px -10px rgba(0,0,0,.45)}
.ad-fan{position:relative;width:100%;height:158px}
.ad-fan .cc{position:absolute;--w:min(168px,46vw);left:50%;bottom:26px;margin-left:calc(min(168px,46vw) / -2);transform-origin:50% 230%;transition:transform .55s var(--spring),box-shadow .4s,z-index 0s .4s}
.ad-fan .cc.up{transition:transform .55s var(--spring),box-shadow .4s,z-index 0s 0s;box-shadow:0 18px 30px -16px rgba(17,17,17,.55)}
.ad-fine{position:relative;z-index:11;margin-top:0;text-align:center;font-size:11.5px;color:#55554f;display:flex;gap:6px;justify-content:center;align-items:center}
.ig-cta{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;background:var(--ink);color:#fff;font-weight:600;font-size:15px}
.ig-cta:hover{background:#000}
.ig-icons{display:flex;gap:14px;padding:12px 14px 4px;font-size:22px}
.ig-icons span:last-child{margin-left:auto}
.ig-cap{padding:4px 14px 16px;font-size:14px}
.ig-cap b{font-weight:600}

/* ---------- LANDING ---------- */
.land-hero{display:grid;gap:36px;padding-block:28px 40px;align-items:center}
.land-hero h1{font-size:38px;line-height:1.04}
.land-hero .sub{margin-top:16px;font-size:17px;color:var(--ink-2);max-width:40ch}
.land-cta{margin-top:26px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.reassure{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-2)}
.viz{position:relative;height:330px;max-width:100%}
.viz-fan{position:absolute;left:50%;top:8px;width:0}
.viz-fan .cc{position:absolute;--w:190px;left:-95px;transition:transform .5s var(--spring),opacity .3s,filter .3s}
.viz-fan .cc.dim{opacity:.32;filter:saturate(.3)}
.viz-fan .cc.hl{box-shadow:0 0 0 2px var(--rec),0 14px 30px -16px rgba(49,87,245,.7)}
.viz svg.paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.viz svg.paths path{fill:none;stroke:#d6d6d0;stroke-width:1.2;stroke-dasharray:3 4;transition:stroke .25s,opacity .25s}
.viz svg.paths path.on{stroke:var(--rec);stroke-dasharray:none;stroke-width:1.6}
.viz svg.paths path.off{opacity:.25}
.viz-otas{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around}
.viz-ota{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:6px;border-radius:12px;transition:background .2s}
.viz-ota .ota{--s:46px;transition:transform .25s var(--spring)}
.viz-ota:hover .ota,.viz-ota.on .ota{transform:translateY(-3px)}
.viz-ota.on{color:var(--ink)}
.equation{border-top:1px solid var(--border);padding-block:34px;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;font-size:22px;font-weight:600;letter-spacing:-0.03em}
.equation .op{color:var(--muted);font-weight:400}
.equation .res{color:var(--rec)}
.land-foot{font-size:12.5px;color:var(--muted);padding-bottom:24px}

/* ---------- ADD CARDS ---------- */
.add-head{padding-top:8px}
.add-head h1{font-size:36px;line-height:1.05}
.add-head p{margin-top:10px;color:var(--ink-2);font-size:16px}
.search{margin-top:22px;position:relative}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-size:18px}
.search input{width:100%;height:50px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:0 14px 0 42px;font-size:15.5px;outline:none}
.search input::placeholder{color:#7a7a75}
.search input:focus{border-color:var(--ink)}
.grid-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;margin-top:22px}
.tile{display:flex;flex-direction:column;gap:9px;text-align:left;border-radius:14px;padding:0;transition:transform .2s var(--ease)}
.tile .cc{--w:100%;width:100%;transition:transform .35s var(--spring),opacity .3s}
.tile:hover .cc{transform:translateY(-3px)}
.tile.added .cc{opacity:.38;transform:scale(.96)}
.tile-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13.5px;min-width:0}
.tile-meta b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-add{font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.tile.added .tag-add{color:var(--pos)}
.empty{padding:40px 0;text-align:center;color:var(--ink-2)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(247,247,244,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:440px;margin-inline:auto;display:grid;gap:10px}
.dock-row{display:flex;align-items:center;gap:12px;min-height:34px}
.dock-stack{display:flex;align-items:center;height:30px}
.dock-stack .cc{--w:46px;margin-left:-26px;box-shadow:0 0 0 1.5px var(--canvas)}
.dock-stack .cc:first-child{margin-left:0}
.dock-count{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
.dock-count b{color:var(--ink)}
.bump{animation:bump .35s var(--spring)}
@keyframes bump{40%{transform:scale(1.18)}}
.dock-note{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;justify-content:center}

/* ---------- MATCHING ---------- */
.match{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:440px;margin-inline:auto;padding-block:30px}
.match-board{position:relative;height:380px;margin-top:10px}
.match-board svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.match-board line{stroke:#d2d2cc;stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .6s var(--ease),stroke .3s,opacity .4s,stroke-width .3s}
.match-board line.drawn{stroke-dashoffset:0}
.match-board line.hit{stroke:var(--rec)}
.match-board line.win{stroke:var(--ink);stroke-width:2.4}
.match-board line.fade{opacity:.12}
.m-cards{position:absolute;left:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around}
.m-cards .cc{--w:118px;transition:transform .4s var(--spring),opacity .4s}
.m-otas{position:absolute;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;align-items:flex-end}
.m-ota{display:flex;flex-direction:column-reverse;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-2);transition:opacity .4s}
.m-ota .ota{--s:44px}
.m-badge{position:absolute;transform:translate(-50%,-50%) scale(.6);opacity:0;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:650;padding:3px 7px;border-radius:7px;transition:opacity .25s,transform .35s var(--spring);font-variant-numeric:tabular-nums;white-space:nowrap}
.m-badge.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.m-badge.win{background:var(--ink);color:#fff;border-color:var(--ink)}
.m-status{min-height:64px}
.m-status h2{font-size:26px;line-height:1.1}
.m-status p{margin-top:6px;color:var(--ink-2);font-size:14px}
.m-step{animation:stepIn .3s var(--ease) both}
@keyframes stepIn{from{opacity:0;transform:translateY(6px)}}
.m-count{display:flex;gap:28px;margin-top:22px;border-top:1px solid var(--border);padding-top:16px}
.m-count div{font-size:12px;color:var(--ink-2)}
.m-count b{display:block;font-size:26px;font-weight:650;color:var(--ink);letter-spacing:-0.03em;font-variant-numeric:tabular-nums}

/* ---------- HOME ---------- */
.home-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:8px}
.greet b{display:block;font-size:15px;font-weight:600}
.greet small{font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.home-h1{font-size:30px;line-height:1.08;margin-top:22px}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-top:16px;grid-template-areas:"main" "wallet" "alts" "trip"}
.g-main{grid-area:main;min-width:0}.g-wallet{grid-area:wallet;min-width:0}.g-alts{grid-area:alts;min-width:0}.g-trip{grid-area:trip;min-width:0}

.modes{display:flex;gap:20px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.modes button{position:relative;padding:8px 0 11px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .2s}
.modes button[aria-selected="true"]{color:var(--ink)}
.modes button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.modes-ctx{font-size:13.5px;font-weight:600;padding:8px 0 11px;color:var(--ink);display:flex;align-items:center;gap:8px}
.modes-ctx button{color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center;gap:4px}

.rec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-hero);overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s var(--ease);box-shadow:0 1px 2px rgba(17,17,17,.03),0 12px 32px -26px rgba(17,17,17,.35);touch-action:pan-y}
.rec:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(17,17,17,.04),0 18px 40px -26px rgba(17,17,17,.4)}
.rec-strip{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--rec-soft);color:#1f3dbd;font-size:12.5px;font-weight:600}
.rec-strip span{display:inline-flex;gap:6px;align-items:center}
.rec-strip .r{color:#2b46c8;font-weight:500}
.rec-body{padding:18px 18px 18px}
.rec-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rec-ota{display:flex;gap:11px;align-items:center;min-width:0}
.rec-ota .ota{--s:46px;transition:transform .25s var(--ease),filter .25s;filter:saturate(.85)}
.rec-ota:hover .ota{transform:scale(1.04);filter:none}
.rec-ota small{display:block;font-size:12.5px;color:var(--ink-2)}
.rec-ota .ota-name{font-size:16px}
.rec-cardslot{position:relative;margin-right:-30px;margin-top:-4px;transition:transform .45s var(--spring)}
.rec-cardslot .cc{--w:118px;transform:rotate(4deg)}
.rec:hover .rec-cardslot{transform:translateX(-16px) translateY(-2px)}
.rec-benefit{margin-top:18px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.big{font-size:68px;line-height:.86;font-weight:650;letter-spacing:-0.055em;font-variant-numeric:tabular-nums}
.big-u{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:650;line-height:1.3;padding-bottom:4px}
.cap{font-size:15px;color:var(--ink-2);margin-top:8px}
.cap b{color:var(--ink);font-weight:600}
.use-line{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14.5px}
.use-line b{font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:16px;border-radius:12px;overflow:hidden;background:var(--border)}
.facts div{background:var(--soft);padding:10px 12px;min-width:0}
.facts dt{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.facts dd{margin:3px 0 0;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.elig{display:inline-flex;gap:7px;align-items:center;margin-top:14px;font-size:13.5px;font-weight:600;color:var(--pos)}
.elig .dotc{width:20px;height:20px;border-radius:50%;background:var(--pos-soft);display:grid;place-items:center;font-size:12px}
.rec-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:18px}
.why-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.why-wrap.open{grid-template-rows:1fr}
.why-wrap > div{overflow:hidden;min-height:0}
.why{border-top:1px dashed var(--border);margin-top:18px;padding-top:16px;opacity:0;transform:translateY(-6px);transition:opacity .3s .1s,transform .4s var(--ease) .05s}
.why-wrap.open .why{opacity:1;transform:none}
.why ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.why li{display:flex;gap:9px;font-size:14px;align-items:flex-start}
.why li .i{color:var(--pos);margin-top:2px}
.checked{margin-top:14px;font-size:13px;color:var(--ink-2)}
.nextbest{margin-top:12px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--soft)}
.nextbest .t{flex:1;min-width:0;font-size:13.5px}
.nextbest .t b{font-weight:600}
.nextbest .t small{display:block;color:var(--ink-2);font-size:12.5px}
.why-foot{display:flex;justify-content:flex-end;margin-top:14px}
.save{margin-top:18px}
.save-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink-2)}
.save-h b{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:650}
.save-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:10px;align-items:start}
.sv{display:flex;flex-direction:column;gap:3px;min-width:0}
.sv small{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sv b{font-size:19px;font-weight:650;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.sv b.no{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;padding-block:4px}
.sv i{display:block;height:3px;border-radius:2px;background:var(--ink);width:var(--p);transform-origin:0 50%;animation:barIn .6s var(--ease) both}
.sv.full i{background:var(--rec)}
@keyframes barIn{from{transform:scaleX(0)}}
.rec-visual{display:none;position:relative;flex-direction:column;justify-content:space-between;gap:18px;border-radius:18px;padding:20px;overflow:hidden;background:radial-gradient(110% 70% at 50% 0%, var(--rec-soft) 0%, transparent 70%), var(--soft);isolation:isolate}
.rv-glow{position:absolute;left:12%;right:12%;top:26%;height:130px;background:var(--cbg);filter:blur(46px);opacity:.28;z-index:-1;border-radius:50%}
.rv-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2)}
.rv-top span{display:inline-flex;gap:6px;align-items:center}
.rv-stage{position:relative;flex:1;min-height:210px;display:grid;place-items:center}
.rv-stage .cc{--w:212px;transform:translate(-10px,22px) rotate(-8deg);transition:transform .55s var(--spring),box-shadow .4s;box-shadow:0 26px 40px -24px rgba(17,17,17,.6),0 2px 6px -2px rgba(17,17,17,.25)}
.rec:hover .rv-stage .cc{transform:translate(2px,14px) rotate(-4deg)}
.rv-stage .ota{--s:54px;position:absolute;right:4px;top:calc(50% - 104px);z-index:2;box-shadow:0 0 0 5px var(--soft),0 12px 24px -14px rgba(17,17,17,.5);transition:transform .35s var(--spring)}
.rec:hover .rv-stage .ota{transform:translate(4px,-4px) scale(1.04)}
.rv-plus{position:absolute;right:58px;top:20px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;color:var(--ink-2);z-index:1}
.rv-cap{display:grid;gap:2px}
.rv-cap b{font-size:17px;font-weight:600;letter-spacing:-0.02em}
.rv-cap span{font-size:13.5px;color:var(--ink-2)}
.swipe-hint{display:flex;justify-content:center;gap:5px;margin-top:12px}
.swipe-hint i{width:6px;height:6px;border-radius:3px;background:#d6d6d0;transition:width .25s,background .25s}
.swipe-hint i.on{width:18px;background:var(--ink)}

/* wallet */
.wal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.wal-head h3{font-size:17px;letter-spacing:-0.02em}
.wal-head small{font-size:12.5px;color:var(--ink-2)}
.wallet{position:relative;display:flex;align-items:flex-end;height:112px;padding-top:14px;touch-action:pan-y;cursor:grab;overflow-x:clip;overflow-y:visible}
.wallet:active{cursor:grabbing}
.wslot{position:relative;flex:none;margin-left:-82px;transition:transform .42s var(--spring),margin .42s var(--spring),filter .3s;transform-origin:50% 100%}
.wslot:first-child{margin-left:0}
.wslot .cc{--w:112px}
.wslot > button:not(.wall){display:block;border-radius:8px}
.wslot.dim{transform:scale(.97);filter:brightness(.92)}
.wslot.active{transform:translateY(-12px);z-index:30 !important}
.wslot.active + .wslot{margin-left:-40px}
.wall{width:64px;height:71px;border-radius:9px;border:1.5px solid var(--ink);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;padding:9px;text-align:left;font-size:12px;font-weight:600}
.wall .stk{display:block;position:relative;height:22px;width:40px;flex:none}
.wall .stk i{position:absolute;width:26px;height:17px;border-radius:3px;border:1.5px solid var(--ink);background:var(--surface)}
.wall .stk i:nth-child(1){left:0;top:4px}.wall .stk i:nth-child(2){left:6px;top:2px}.wall .stk i:nth-child(3){left:12px;top:0;background:var(--ink)}
.wslot.allslot{margin-right:12px}
.wslot.allslot:not(.active) .wall{border-color:var(--border);color:var(--ink-2)}
.wslot.allslot:not(.active) .wall .stk i{border-color:#b9b9b2}
.wslot.allslot:not(.active) .wall .stk i:nth-child(3){background:#b9b9b2}
.wslot.allslot + .wslot{margin-left:0}
.wslot.addslot button{width:58px;height:83px;border-radius:9px;border:1.5px dashed #c9c9c2;display:grid;place-items:center;color:var(--ink-2);font-size:20px;background:transparent}
.wslot.addslot{display:none}
.wal-add{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.wal-tip{font-size:12px;color:var(--muted);margin-top:8px}

/* alternatives */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-h h3{font-size:17px;letter-spacing:-0.02em}
.alts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,82%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:calc(var(--gutter) * -1);padding-inline:var(--gutter);scrollbar-width:none}
.alt{scroll-snap-align:start;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:15px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s,transform .2s var(--ease)}
.alt:hover{border-color:#cfcfc9;transform:translateY(-2px)}
.alt-k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:650;color:var(--ink-2)}
.alt-pair{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.alt-pair .x{color:var(--muted);font-weight:400}
.alt-pair .cc{--w:44px}
.alt-pair .ota{--s:30px}
.alt-v{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.alt-v b{font-size:26px;font-weight:650;letter-spacing:-0.04em}
.alt-v span{font-size:13px;color:var(--ink-2)}
.alt-why{font-size:13px;color:var(--ink-2);border-top:1px solid var(--border);padding-top:10px;display:flex;gap:7px;align-items:flex-start}
.chip-later{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:6px}
.alt.more{justify-content:space-between;background:var(--soft);border-style:dashed}
.alt.more b{font-size:18px;letter-spacing:-0.02em;font-weight:600}

/* trip teaser */
.trip{position:relative;display:grid;grid-template-columns:minmax(0,1fr);border-radius:var(--r-hero);overflow:hidden;background:#0f1a24;color:#fff;text-align:left;width:100%;min-height:340px}
.scene{position:absolute;inset:0}
.scene-bali{background:
  radial-gradient(18% 13% at 72% 52%, #ffe9b8 0%, #ffc978 40%, rgba(255,170,90,0) 100%),
  linear-gradient(180deg,#2c3f64 0%,#7d6b8e 26%,#e59a7c 46%,#f6c48d 54%,#3f5d73 55%,#24414f 72%,#12232c 100%)}
.scene-bali::before{content:"";position:absolute;left:0;right:0;top:55%;bottom:0;background:repeating-linear-gradient(180deg,rgba(255,214,160,.16) 0 1px,transparent 1px 9px);mask-image:linear-gradient(90deg,transparent 40%,#000 72%,transparent 96%);-webkit-mask-image:linear-gradient(90deg,transparent 40%,#000 72%,transparent 96%)}
.scene-bali::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,24,0) 30%,rgba(10,16,24,.75) 100%)}
.trip-in{position:relative;padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:22px;min-height:340px}
.trip-k{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:650;color:rgba(255,255,255,.85)}
.trip h3{font-size:40px;line-height:.95;letter-spacing:-0.045em;margin-top:10px}
.trip h3 small{display:block;font-size:15px;letter-spacing:0;font-weight:500;margin-top:10px;opacity:.85}
.trip-cards{display:grid;gap:8px;font-size:13.5px}
.trip-cards div{display:flex;align-items:center;gap:10px}
.trip-cards .cc{--w:40px;box-shadow:none}
.trip-cards span{opacity:.75}
.trip-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.trip-foot p{font-size:13px;opacity:.8;max-width:30ch}
.trip-go{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;background:#fff;color:#111;font-weight:600;font-size:14.5px;white-space:nowrap}
.trip-brand{display:block;font-size:12px;font-weight:600;opacity:.75;margin-top:6px}

/* ---------- ALL OFFERS ---------- */
.ctrl{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--canvas);margin-inline:calc(var(--gutter) * -1);padding:10px var(--gutter);border-bottom:1px solid var(--border)}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none;max-width:440px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);padding:0 10px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(17,17,17,.08)}
.rows{margin-top:6px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--border);transition:background .2s}
.row:hover{background:linear-gradient(90deg,transparent,var(--soft) 10%,var(--soft) 90%,transparent)}
.row .ota{--s:40px}
.row-main{min-width:0}
.row-main .o{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.row-main .v{font-size:16px;font-weight:650;letter-spacing:-0.02em;margin-top:1px}
.row-main .v span{font-weight:500;color:var(--ink-2);font-size:13.5px;letter-spacing:0}
.row-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);margin-top:5px}
.row-meta .cc{--w:34px;box-shadow:none}
.row-end{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tagx{font-size:11px;font-weight:650;padding:3px 7px;border-radius:6px;white-space:nowrap}
.tagx.best{background:var(--rec-soft);color:#1f3dbd}
.tagx.soon{background:var(--warn-soft);color:var(--warn)}
.tagx.cb{background:var(--soft);color:var(--ink-2)}
.row-desk{display:none}

/* ---------- DETAIL ---------- */
.det-hero{display:flex;align-items:center;gap:14px;margin-top:10px}
.det-hero .x{color:var(--muted);font-size:20px}
.det-hero .ota{--s:56px}
.det-hero .cc{--w:110px}
.det-title{margin-top:18px;font-size:15px;color:var(--ink-2)}
.det-title b{color:var(--ink);font-weight:600}
.det-big{display:flex;align-items:flex-end;gap:12px;margin-top:10px}
.det-big .big{font-size:84px}
.ladder{margin-top:26px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:6px 16px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;position:relative;opacity:.25;transition:opacity .35s}
.step.in{opacity:1}
.step + .step{border-top:1px solid var(--border)}
.step .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.step .v{font-size:15px;font-weight:600}
.step .ck{width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--muted);transition:background .3s,color .3s}
.step.in .ck{background:var(--pos-soft);color:var(--pos)}
.step .n{font-size:12.5px;color:var(--ink-2);text-align:right}
.result{margin-top:12px;display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:var(--r-card);background:var(--pos-soft);color:var(--pos);font-weight:650;letter-spacing:.04em;font-size:13.5px;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s var(--ease)}
.result.in{opacity:1;transform:none}
.cond{margin-top:16px;border-top:1px solid var(--border)}
.cond summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-weight:600;font-size:14.5px}
.cond summary::-webkit-details-marker{display:none}
.cond[open] summary .i{transform:rotate(180deg)}
.cond summary .i{transition:transform .25s}
.cond ul{margin:0 0 12px;padding-left:18px;color:var(--ink-2);font-size:14px;display:grid;gap:6px}
.lastchk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);margin-top:6px}

/* ---------- HANDOFF ---------- */
.ho{max-width:440px;margin-inline:auto;padding-top:10px}
.ho-anim{position:relative;height:150px;display:flex;align-items:center;justify-content:center;gap:56px}
.ho-anim .ota{--s:64px}
.ho-anim .cc{--w:130px}
.ho-ready{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--pos);display:flex;gap:6px;align-items:center}
.ho h1{font-size:32px;line-height:1.08;margin-top:8px}
.ho-to{display:flex;align-items:center;gap:12px;margin-top:14px}
.ho-to .ota{--s:48px}
.ho-to b{font-size:20px;font-weight:600;letter-spacing:-0.02em}
.remember{margin-top:26px;position:relative}
.remember .cc{--w:min(300px,78%);margin-inline:auto;width:min(300px,78%);margin-bottom:-56px;position:relative;z-index:1}
.remember-box{position:relative;z-index:2;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px 18px 18px;box-shadow:0 16px 40px -28px rgba(17,17,17,.4)}
.remember-box .v{font-size:24px;font-weight:650;letter-spacing:-0.03em;margin-top:6px}
.remember-box .c{color:var(--ink-2)}
.remember-box dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--border)}
.remember-box dt{font-size:12.5px;color:var(--ink-2)}
.remember-box dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.note{display:flex;gap:9px;align-items:flex-start;margin-top:16px;font-size:13.5px;color:var(--ink-2)}
.note .i{color:var(--warn);margin-top:2px}
.ho-actions{display:grid;gap:10px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;transition:opacity .2s,transform .3s var(--spring);z-index:60;display:flex;gap:8px;align-items:center;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* redirect sim */
.browser{max-width:440px;margin:18px auto 0;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface)}
.b-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--soft);font-size:13px;color:var(--ink-2)}
.b-url{flex:1;background:var(--surface);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.b-prog{height:2px;background:var(--rec);width:0;animation:prog 1.8s var(--ease) forwards}
@keyframes prog{to{width:100%}}
.b-body{padding:20px;display:grid;gap:12px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--soft) 0%,#e9e9e4 50%,var(--soft) 100%);background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.pin{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px}
.pin .cc{--w:46px;box-shadow:none}
.pin b{font-weight:600}

/* recovery */
.dead{position:relative;transform-origin:50% 0;transition:transform .5s var(--ease),opacity .5s,filter .5s}
.dead.collapse{transform:scaleY(.6) translateY(-10px);opacity:.35;filter:grayscale(1)}
.dead .rec:hover{transform:none}
.ended{display:inline-flex;align-items:center;gap:7px;color:var(--danger);font-weight:600;font-size:14px;margin-top:6px}
.next-in{animation:riseIn .55s var(--ease) both}
@keyframes riseIn{from{opacity:0;transform:translateY(24px)}}

/* ---------- 30 SUNDAYS ---------- */
.story{position:fixed;inset:0;z-index:40;background:#0d1620;color:#fff;overflow-y:auto}
.story .scene{position:fixed}
.story-in{position:relative;max-width:560px;margin-inline:auto;padding:calc(18px + env(safe-area-inset-top,0px)) var(--gutter) 60px}
.story-top{display:flex;justify-content:space-between;align-items:center;height:48px}
.story-top .brand30{font-weight:650;letter-spacing:-0.01em}
.story .iconbtn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}
.st-k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:650;opacity:.85}
.st-h{font-size:64px;line-height:.9;letter-spacing:-0.055em;font-weight:650;margin-top:14px}
.st-sub{font-size:17px;opacity:.85;margin-top:12px}
.st-list{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:4px;font-size:22px;font-weight:500;letter-spacing:-0.02em}
.st-list li{opacity:0;animation:fadeUp .5s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.glass{background:rgba(8,14,22,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:18px}
.why-now{margin-top:34px;display:grid;gap:12px}
.why-now .row2{display:flex;align-items:center;gap:12px;font-size:14.5px}
.why-now .row2 .cc{--w:52px;box-shadow:none}
.why-now .row2 span{opacity:.75;display:block;font-size:13px}
.why-now .row2 .ico{width:52px;display:grid;place-items:center;font-size:20px;opacity:.9}
.st-q{font-size:24px;line-height:1.15;letter-spacing:-0.03em;font-weight:600;margin-top:34px}
.btn.light{background:#fff;color:#111}
.btn.light:hover{background:#f1f1ee}
.btn.ghost-l{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff}
.prefs{position:fixed;inset:0;z-index:41;background:var(--canvas);overflow-y:auto}
.prefs-in{max-width:560px;margin-inline:auto;padding:calc(10px + env(safe-area-inset-top,0px)) var(--gutter) 120px}
.prefs h2{font-size:32px;line-height:1.05;margin-top:12px}
.choices{display:grid;gap:10px;margin-top:20px}
.choice{position:relative;height:96px;border-radius:16px;overflow:hidden;color:#fff;text-align:left;padding:16px;display:flex;align-items:flex-end;justify-content:space-between;font-weight:650;font-size:17px;letter-spacing:.02em;transition:transform .3s var(--spring),box-shadow .25s}
.choice .bg{position:absolute;inset:0;transition:transform .6s var(--ease)}
.choice:hover .bg{transform:scale(1.04)}
.choice span{position:relative}
.choice .ck{position:relative;width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);display:grid;place-items:center;transition:background .2s}
.choice.sel{box-shadow:0 0 0 3px var(--ink);transform:scale(.985)}
.choice.sel .ck{background:#fff;color:#111;border-color:#fff}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.opt{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px;text-align:left;transition:border-color .2s,transform .3s var(--spring)}
.opt b{display:block;font-size:15.5px;font-weight:600}
.opt small{color:var(--ink-2);font-size:13px}
.opt .i{font-size:20px;margin-bottom:12px}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);transform:scale(.985)}

<script>
(() => {
"use strict";
/* ================= DATA (prototype only, not live offers) ================= */
const TODAY = new Date(2026, 9, 7); // fixed prototype date: 7 Oct 2026
const OTAS = {
  mmt: { id:"mmt", name:"MakeMyTrip", url:"https://www.makemytrip.com" },

const CARDS = [

  { id:"icici-amazon", bank:"ICICI Bank", short:"ICICI", name:"Amazon Pay", net:"visa", last4:"7310", popular:true,
    bg:"linear-gradient(135deg,#25282d 0%,#0f1114 100%)", art:"radial-gradient(70% 60% at 100% 100%, rgba(255,153,0,.38), transparent 60%)", fg:"#f2f2f2" },
  { id:"amex-mrcc", bank:"American Express", short:"Amex", name:"MRCC", net:"amex", last4:"1009", popular:true,
    bg:"linear-gradient(135deg,#a8bdd0 0%,#7590aa 60%,#5d7893 100%)", art:"radial-gradient(100% 70% at 10% 0%, rgba(255,255,255,.5), transparent 55%)", fg:"#0f1d2b" },
  { id:"hdfc-millennia", bank:"HDFC Bank", short:"HDFC", name:"Millennia", net:"mc", last4:"5530",
    bg:"linear-gradient(135deg,#1b3a6b,#0d1d38)", art:"radial-gradient(80% 60% at 100% 0%, rgba(120,200,255,.25), transparent 60%)", fg:"#eef5ff" },
  { id:"axis-magnus", bank:"Axis Bank", short:"Axis", name:"Magnus", net:"visa", last4:"6612",
    bg:"linear-gradient(135deg,#3a2f2a,#14100e)", art:"radial-gradient(90% 70% at 0% 0%, rgba(230,200,160,.22), transparent 60%)", fg:"#f5ece2" },
  { id:"icici-sapphiro", bank:"ICICI Bank", short:"ICICI", name:"Sapphiro", net:"mc", last4:"3384",
    bg:"linear-gradient(135deg,#1e4f63,#0b2430)", art:"radial-gradient(80% 80% at 100% 100%, rgba(120,230,230,.22), transparent 60%)", fg:"#e9fbff" },
  { id:"sbi-elite", bank:"SBI Card", short:"SBI", name:"Elite", net:"visa", last4:"9051",
    bg:"linear-gradient(135deg,#4a4a4f,#1d1d20)", art:"radial-gradient(90% 70% at 100% 0%, rgba(255,255,255,.18), transparent 60%)", fg:"#f4f4f4" },
  { id:"hdfc-diners", bank:"HDFC Bank", short:"HDFC", name:"Diners Black", net:"diners", last4:"7702",
    bg:"linear-gradient(135deg,#151515,#050505)", art:"repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 6px)", fg:"#eaeaea" },
  { id:"amex-plat", bank:"American Express", short:"Amex", name:"Platinum Travel", net:"amex", last4:"2240",
    bg:"linear-gradient(135deg,#d9dcde,#a7adb2)", art:"radial-gradient(100% 70% at 0% 0%, rgba(255,255,255,.6), transparent 55%)", fg:"#1b1f23" }
];
const C = Object.fromEntries(CARDS.map(c => [c.id, c]));
const D = (m, d) => new Date(2026, m - 1, d);
const OFFERS = [
  { id:"o1",  card:"hdfc-regalia", ota:"mmt", cat:"Flights", kind:"instant",  pct:12, cap:1200, min:5000,  ends:D(11,15), scope:"Domestic flights" },
  { id:"o2",  card:"axis-atlas",   ota:"ct",  cat:"Flights", kind:"instant",  pct:10, cap:1500, min:10000, ends:D(11,20), scope:"Domestic and international flights" },
  { id:"o3",  card:"sbi-cashback", ota:"emt", cat:"Flights", kind:"cashback", pct:8,  cap:1000, min:7500,  ends:D(11,30), scope:"Domestic flights" },
  { id:"o4",  card:"icici-amazon", ota:"yt",  cat:"Flights", kind:"instant",  pct:8,  cap:800,  min:5000,  ends:D(11,12), scope:"Domestic flights" },
  { id:"o5",  card:"amex-mrcc",    ota:"mmt", cat:"Flights", kind:"flat",     flat:750, cap:750, min:8000, ends:D(10,31), scope:"Domestic flights" },
  { id:"o6",  card:"hdfc-regalia", ota:"ct",  cat:"Hotels",  kind:"instant",  pct:10, cap:1200, min:6000,  ends:D(11,25), scope:"Hotels in India" },
  { id:"o7",  card:"axis-atlas",   ota:"mmt", cat:"Hotels",  kind:"instant",  pct:8,  cap:1500, min:12000, ends:D(11,10), scope:"Hotels, 2+ nights" },
  { id:"o8",  card:"sbi-cashback", ota:"yt",  cat:"Hotels",  kind:"cashback", pct:6,  cap:800,  min:8000,  ends:D(11,22), scope:"Hotels in India" },
  { id:"o9",  card:"icici-amazon", ota:"mmt", cat:"Hotels",  kind:"instant",  pct:6,  cap:600,  min:4000,  ends:D(11,18), scope:"Hotels in India" },
  { id:"o10", card:"amex-mrcc",    ota:"ct",  cat:"Hotels",  kind:"instant",  pct:5,  cap:750,  min:6000,  ends:D(11,28), scope:"Hotels in India" },
  { id:"o11", card:"hdfc-regalia", ota:"emt", cat:"Flights", kind:"instant",  pct:10, cap:750,  min:4000,  ends:D(10,9),  scope:"Domestic flights" },
  { id:"o12", card:"axis-atlas",   ota:"yt",  cat:"Flights", kind:"instant",  pct:6,  cap:600,  min:6000,  ends:D(10,14), scope:"Domestic flights" }
];
const DEFAULT_WALLET = ["hdfc-regalia","axis-atlas","sbi-cashback","icici-amazon","amex-mrcc"];

/* ================= ENGINE ================= */
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const k = n => n >= 1000 ? "₹" + (n/1000).toString().replace(/\.0$/,"") + "k" : inr(n);
const fmtDate = d => d.getDate() + " " + d.toLocaleString("en-GB",{month:"short"});
const fmtDateLong = d => d.getDate() + " " + d.toLocaleString("en-GB",{month:"long"});
const daysLeft = o => Math.round((o.ends - TODAY) / 864e5);
const benefit = (o, s) => s < o.min ? 0 : (o.kind === "flat" ? o.flat : Math.min(Math.round(o.pct/100*s), o.cap));
const headline = o => o.kind === "flat" ? inr(o.flat) : o.pct + "%";
const unitLabel = o => o.kind === "flat" ? "flat off" : o.kind === "cashback" ? "cashback" : "instant off";
const longLabel = o => o.kind === "flat" ? "Flat discount" : o.kind === "cashback" ? "Cashback" : "Instant discount";
const maxB = o => o.kind === "flat" ? o.flat : o.cap;
/* Mock score: expected benefit at a typical (8k) and a larger (15k) booking,
   discounted for cashback (credited later) and for offers about to lapse. */
function score(o){
  let s = 0.6*benefit(o,8000) + 0.4*benefit(o,15000);
  if (o.kind === "cashback") s *= 0.85;
  if (daysLeft(o) <= 3) s *= 0.95;
  return s;
}
function pool(filterCard){
  return OFFERS.filter(o => state.wallet.includes(o.card) && !state.expired.includes(o.id) && (!filterCard || filterCard === "all" || o.card === filterCard))
               .sort((a,b) => score(b) - score(a));
}
function picks(){
  const p = pool("all");
  const best = p[0];
  const spend = p.filter(o => o !== best).sort((a,b) => benefit(b,20000) - benefit(a,20000))[0];
  const cash = p.filter(o => o.kind === "cashback" && o !== best && o !== spend)[0];
  return { best, spend, cash };
}
function crossover(cur, next){
  for (let s = 1000; s <= 60000; s += 500) if (benefit(next,s) > benefit(cur,s)) return s;
  return null;
}
function edgeAt(o, s){
  const others = pool("all").filter(x => x !== o).map(x => benefit(x,s));
  return benefit(o,s) - Math.max(0, ...others);
}

/* ================= STATE ================= */
const store = {
  get(k, d){ try { const v = localStorage.getItem("cardpick:" + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("cardpick:" + k, JSON.stringify(v)); } catch(e){} }
};
const state = {
  screen: "ad", hist: [],
  wallet: store.get("wallet", []),
  filter: "all", mode: "best", whyOpen: false,
  offer: null, cat: "rec", expired: [],
  trip: { vibe: null, opt: null, saved: false }
};
const timers = [];
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
const every = (fn, ms) => { const t = setInterval(fn, ms); timers.push(t); return t; };
const clearTimers = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers.length = 0; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= ANALYTICS ================= */
const events = [];
function track(name, props){
  events.push({ name, props: props || {}, t: new Date() });
  renderEvents();
}
const FUNNEL = [
  ["Ad to landing (CTR)", "ad_viewed", "ad_cta_clicked"],
  ["Landing to card selection", "landing_viewed", "card_selected"],
  ["Wallet to first recommendation", "wallet_completed", "recommendations_generated"],
  ["Recommendation to OTA redirect", "best_offer_viewed", "ota_redirect_clicked"],
  ["Why-this-offer open rate", "best_offer_viewed", "why_this_offer_opened"],
  ["Trip idea seen to opened", "trip_opportunity_seen", "trip_opportunity_opened"],
  ["Trip opened to preview (lead)", "trip_opportunity_opened", "trip_preview_generated"]
];
function renderEvents(){
  const has = n => events.some(e => e.name === n);
  document.getElementById("evtCount").textContent = events.length;
  document.getElementById("evtFunnel").innerHTML = FUNNEL.map(([l,a,b]) =>
    `<div><span>${l}</span><span class="${has(a)&&has(b)?"ok":""}">${has(a) ? (has(b) ? "converted" : "open") : "not reached"}</span></div>`).join("");
  document.getElementById("evtList").innerHTML = events.slice().reverse().map(e =>
    `<div><span class="n">${e.name}</span><span class="p">${e.t.toLocaleTimeString("en-GB")} ${Object.keys(e.props).length ? JSON.stringify(e.props) : ""}</span></div>`).join("");
}

/* ================= COMPONENTS ================= */
function netHTML(n){
  if (n === "visa") return `<span class="net-visa">VISA</span>`;
  if (n === "mc") return `<span class="net-mc" aria-label="Mastercard"><i></i><i></i></span>`;
  if (n === "amex") return `<span class="net-amex">AMEX</span>`;
  return `<span class="net-diners">Diners Club</span>`;
}
function cardHTML(id, opts){
  opts = opts || {};
  const c = C[id];
  return `<div class="cc ${opts.mini ? "mini" : ""} ${opts.cls || ""}" data-card="${id}" style="--bg:${c.bg};--art:${c.art};--fg:${c.fg};${opts.style || ""}" role="img" aria-label="${c.bank} ${c.name} card ending ${c.last4}">
    <div class="cc-in">
      <div class="cc-top"><span class="cc-bank">${opts.mini ? c.short : c.bank.replace("American Express","Amex")}</span><span class="cc-name">${c.name}</span></div>
      <div class="cc-chip"></div>
      <div class="cc-bot"><span class="cc-num">•••• ${c.last4}</span>${netHTML(c.net)}</div>
    </div></div>`;
}
function otaHTML(id, s, extra){
  const st = s ? `style="--s:${s}px"` : "";
  const t = `title="${OTAS[id].name}" role="img" aria-label="${OTAS[id].name}"`;
  if (id === "mmt") return `<span class="ota ota--mmt ${extra||""}" ${st} ${t}><b>my</b></span>`;

const app = document.getElementById("app");
function go(screen, opts){
  opts = opts || {};
  if (!opts.back && state.screen && state.screen !== screen) state.hist.push(state.screen);
  clearTimers();
  closeSheet(true);
  document.getElementById("layer").innerHTML = "";
  const old = app.firstElementChild;
  if (old && !reduce) { old.classList.add("leaving"); setTimeout(() => old.remove(), 180); }
  else if (old) old.remove();
  state.screen = screen;
  const el = document.createElement("main");
  el.className = "screen";
  el.dataset.screen = screen;
  el.innerHTML = SCREENS[screen].html();
  app.appendChild(el);
  document.body.classList.toggle("has-dock", screen === "add");
  const dock = document.getElementById("dock");
  dock.hidden = screen !== "add";
  if (screen !== "add") dock.innerHTML = "";
  window.scrollTo({ top: 0, behavior: "instant" });
  paint();
  SCREENS[screen].mount && SCREENS[screen].mount(el);
}
function back(){
  const prev = state.hist.pop();
  go(prev || "landing", { back: true });
}
function paint(){ if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 1.75 } }); }
function toast(msg){
  const t = document.getElementById("toast");
  t.innerHTML = icon("check") + msg; paint();
  t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function drawMain(animate){

  const swap = () => {
    g.innerHTML = modesHTML() + recHTML(o);
    paint(); bindSwipe();
    if (animate && !reduce) {
      const body = g.querySelector("#recBody");
      body && body.animate([{ opacity:0, transform:"translateY(8px)" },{ opacity:1, transform:"none" }], { duration:280, easing:"cubic-bezier(.2,.8,.2,1)" });
      const slot = g.querySelector(innerWidth >= 900 ? ".rv-stage" : ".rec-cardslot");
      slot && slot.animate([{ transform:"translateX(40px) rotate(6deg)", opacity:0 },{ transform:"none", opacity:1 }], { duration:420, easing:"cubic-bezier(.34,1.25,.64,1)" });
    }
  };

  if (animate && body && !reduce) body.animate([{ opacity:1 },{ opacity:0, transform:"translateY(-6px)" }], { duration:140, easing:"ease-in" }).onfinish = swap;
  else swap();

function bindSwipe(){
  const rec = document.getElementById("rec"); if (!rec || state.filter !== "all") return;
  let x0 = null, y0 = 0;
  rec.addEventListener("pointerdown", e => { if (e.target.closest("button")) return; x0 = e.clientX; y0 = e.clientY; });
  rec.addEventListener("pointerup", e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
    const modes = ["best","spend","cash"].filter(m => m !== "cash" || picks().cash);
    const i = modes.indexOf(state.mode) + (dx < 0 ? 1 : -1);
    if (i >= 0 && i < modes.length) setMode(modes[i]);
  });
}
function setMode(m){
  if (m === state.mode) return;

}

function drawWallet(){

  paint();
  bindWalletDrag(w);
}
function bindWalletDrag(w){
  if (w._bound) return; w._bound = true;
  let sx = null, moved = false, acc = 0, lp = null;
  w.addEventListener("pointerdown", e => {
    sx = e.clientX; moved = false; acc = 0;
    const btn = e.target.closest('[data-action="wcard"]');
    clearTimeout(lp);
    if (btn) lp = setTimeout(() => { moved = true; w._suppress = true; openCardSheet(btn.dataset.id); }, 520);
  });
  w.addEventListener("pointermove", e => {
    if (sx === null || innerWidth >= 900) return;
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 8) { moved = true; clearTimeout(lp); }
    if (Math.abs(dx - acc) > 46) {
      const dir = dx - acc < 0 ? 1 : -1; acc = dx;
      const list = ["all", ...walletOrder()];
      const i = Math.min(list.length-1, Math.max(0, list.indexOf(state.filter) + dir));
      if (list[i] !== state.filter) setFilter(list[i], true);
    }
  });
  const end = () => { clearTimeout(lp); if (moved) w._suppress = true; sx = null; setTimeout(() => { w._suppress = false; }, 30); };
  w.addEventListener("pointerup", end); w.addEventListener("pointercancel", end); w.addEventListener("pointerleave", () => { clearTimeout(lp); sx = null; });
  w.addEventListener("contextmenu", e => e.preventDefault());
}
function setFilter(id, fromDrag){
  if (state.filter === id) return;
  state.filter = id; state.whyOpen = false;
  if (id === "all") state.mode = "best";
  track("card_filter_changed", { card: id, via: fromDrag ? "drag" : "tap" });
  const w = document.getElementById("wallet");
  w.querySelectorAll(".wslot").forEach(s => {
    const sid = s.dataset.slot || (s.classList.contains("allslot") ? "all" : null);
    if (!sid) return;
    s.classList.toggle("active", sid === id);
    s.classList.toggle("dim", sid !== id && id !== "all");
    const b = s.querySelector("button"); b && b.setAttribute("aria-pressed", String(sid === id));
  });
  drawMain(true); drawAlts();
}

function drawAlts(){
  const g = document.getElementById("gAlts"); if (!g) return;
  const cur = currentRec();
  let items = [];
  if (state.filter === "all") {
    const p = picks();
    const add = (o, label, why) => { if (o && o !== cur && !items.some(x => x.o === o)) items.push({ o, label, why }); };
    if (p.best) add(p.best, "Best overall", "Strongest benefit across typical bookings.");
    if (p.spend) { const x = crossover(p.best, p.spend); add(p.spend, "Best for higher spend", x ? `Saves more if your booking is above ${inr(x)}.` : `Highest cap: ${inr(maxB(p.spend))}.`); }
    if (p.cash) add(p.cash, "Best cashback", "Paid back after travel, not at checkout.");
    pool("all").forEach(o => { if (items.length < 3) add(o, "Strong match", `${o.cat} on ${OTAS[o.ota].name}, ${inr(o.min)} minimum.`); });
  } else {
    pool(state.filter).filter(o => o !== cur).forEach(o => items.push({ o, label: o.cat === "Hotels" ? "Also on this card: hotels" : "Also on this card", why: `${inr(o.min)} minimum, valid until ${fmtDate(o.ends)}.` }));

    el.querySelectorAll("#dead button").forEach(b => { b.disabled = true; b.tabIndex = -1; });
    const dead = OFFERS.find(o => o.id === state.deadId);
    const same = pool("all").filter(o => o.cat === dead.cat).sort((a,b) => maxB(b) - maxB(a) || score(b) - score(a));
    const next = same[0] || picks().best;
    later(() => el.querySelector("#dead").classList.add("collapse"), reduce ? 0 : 500);
    later(() => {
      const d = el.querySelector("#dead");
      d.animate([{ maxHeight:d.offsetHeight+"px" },{ maxHeight:"0px", opacity:0 }], { duration: reduce ? 1 : 380, easing:"ease-in", fill:"forwards" });
      d.style.overflow = "hidden";
      const m = el.querySelector("#recoverMsg"); m.style.marginTop = "0"; m.animate([{ opacity:0, transform:"translateY(8px)" },{ opacity:1, transform:"none" }], { duration:300, fill:"forwards" });
    }, reduce ? 0 : 1100);
    later(() => {
      const s = el.querySelector("#nextSlot");
      const prevMode = state.mode, prevFilter = state.filter; state.mode = "best"; state.filter = "all"; state.whyOpen = false;
      s.innerHTML = `<div class="next-in">${recHTML(next, { strip: `<span>${icon("rotate-ccw")} Next best for ${next.cat.toLowerCase()}</span><span class="r">Highest cap left in your wallet</span>` }).replace(/data-action="use" data-id="([^"]+)">Use on [^<]+/, 'data-action="use-instead" data-id="$1">Use this instead ')}</div>`;
      state.mode = prevMode; state.filter = prevFilter;
      paint();
    }, reduce ? 0 : 1500);
  }
};

/* ---- 30 Sundays: story, preferences, preview ---- */
const VIBES = [
  ["romantic","Slow & romantic","radial-gradient(60% 80% at 80% 20%, #f7b49a, transparent 60%), linear-gradient(135deg,#6d3b55,#2b1a2e)"],
  ["food","Food & culture","radial-gradient(70% 70% at 20% 80%, #f2a65a, transparent 60%), linear-gradient(135deg,#7a3b1c,#2b170c)"],
  ["adventure","Adventure","radial-gradient(70% 60% at 70% 100%, #8fc7a2, transparent 60%), linear-gradient(160deg,#28503f,#0f2219)"],
  ["beach","Beach & nothing else","radial-gradient(60% 60% at 75% 35%, #ffe2a8, transparent 55%), linear-gradient(180deg,#5fa7c4 0%,#9fd3d9 50%,#e9d6b0 51%,#d8c08f 100%)"],
  ["mix","A bit of everything","linear-gradient(110deg,#3f5d73 0%,#7d6b8e 40%,#e59a7c 75%,#f6c48d 100%)"]
];
const OPTS = [["stays","Better stays","Fewer, nicer hotels","bed-double"],["exp","More experiences","Packed, but paced","compass"],["spend","Lower spend","Keep it light","piggy-bank"],["bal","Balanced","A bit of each","scale"]];
const LINES = {
  romantic:"Slow mornings. Long dinners.\nAnd enough time to actually be together.",
  food:"Morning markets. Warung lunches.\nAnd enough time to actually be together.",
  adventure:"Sunrise hikes. Waterfall swims.\nAnd enough time to actually be together.",
  beach:"Sand, swims, sunsets.\nAnd enough time to actually be together.",
  mix:"Slow mornings. A little adventure.\nAnd enough time to actually be together."
};
function openTrip(){
  track("trip_opportunity_opened");
  const card = document.getElementById("tripScene");
  const r = card ? card.getBoundingClientRect() : null;
  const layer = document.getElementById("layer");
  const flightCard = state.wallet.includes("hdfc-regalia") ? "hdfc-regalia" : state.wallet[0];
  const hotelCard = state.wallet.includes("axis-atlas") ? "axis-atlas" : (state.wallet[1] || state.wallet[0]);
  layer.innerHTML = `<div class="story" id="story" role="dialog" aria-modal="true" aria-label="Bali for two">
    <div class="scene scene-bali"></div>
    <div class="story-in">
      <div class="story-top"><span class="brand30">30 Sundays</span><button class="iconbtn" type="button" data-action="close-story" aria-label="Close">${icon("x")}</button></div>
      <p class="st-sub" style="margin-top:40px">Your cards gave us an idea.</p>
      <h1 class="st-h">BALI<br>FOR TWO</h1>
      <div class="st-k" style="margin-top:14px">5 nights</div>
      <ul class="st-list">${["Relaxed mornings","Great food","Light adventure","One unforgettable stay"].map((t,i) => `<li style="animation-delay:${.5+i*.12}s">${t}</li>`).join("")}</ul>
      <div class="glass why-now">
        <div class="st-k">Why now?</div>
        <div class="row2">${cardHTML(flightCard,{mini:true})}<div><b>${cardFull(flightCard)}</b><span>Flight offer available</span></div></div>
        <div class="row2">${cardHTML(hotelCard,{mini:true})}<div><b>${cardFull(hotelCard)}</b><span>Hotel benefit available</span></div></div>
        <div class="row2"><span class="ico">${icon("calendar-days")}</span><div><b>Upcoming travel window</b><span>Both offers run into late November</span></div></div>
      </div>
      <p class="st-q">Want to see what this could look like for both of you?</p>
      <div style="display:grid;gap:10px;margin-top:18px"><button class="btn light block" type="button" data-action="build-trip">Build our trip ${icon("arrow-right")}</button></div>
    </div>
  </div>`;
  paint();
  const s = document.getElementById("story");
  if (r && !reduce) {
    const vw = innerWidth, vh = innerHeight;
    s.animate([
      { clipPath:`inset(${r.top}px ${vw - r.right}px ${vh - r.bottom}px ${r.left}px round 22px)` },
      { clipPath:"inset(0px 0px 0px 0px round 0px)" }
    ], { duration:560, easing:"cubic-bezier(.2,.8,.2,1)" });
    s.querySelector(".story-in").animate([{ opacity:0, transform:"translateY(20px)" },{ opacity:1, transform:"none" }], { duration:500, delay:250, easing:"cubic-bezier(.2,.8,.2,1)", fill:"backwards" });
  }
  document.body.style.overflow = "hidden";
}
function closeLayer(){ document.getElementById("layer").innerHTML = ""; document.body.style.overflow = ""; }
function openPrefs(step){
  const layer = document.getElementById("layer");
  const t = state.trip;
  let inner;
  if (step === 1) inner = `<div class="label">Step 1 of 2</div><h2>What's your kind of getaway?</h2>
      <div class="choices">${VIBES.map(([id,l,bg]) => `<button type="button" class="choice ${t.vibe === id ? "sel" : ""}" data-action="vibe" data-id="${id}" aria-pressed="${t.vibe === id}"><span class="bg" style="background:${bg}"></span><span>${l.toUpperCase()}</span><span class="ck">${icon("check")}</span></button>`).join("")}</div>`;
  else if (step === 2) inner = `<div class="label">Step 2 of 2</div><h2>What would you optimize?</h2>
      <div class="opt-grid">${OPTS.map(([id,l,s,ic]) => `<button type="button" class="opt ${t.opt === id ? "sel" : ""}" data-action="opt" data-id="${id}" aria-pressed="${t.opt === id}">${icon(ic)}<b>${l}</b><small>${s}</small></button>`).join("")}</div>`;
  else inner = `<div class="gen"><div><h2 style="font-size:26px">Shaping your Bali trip</h2><p>Matching your pace to your card benefits</p><div class="gen-bar"><i></i></div></div></div>`;
  layer.innerHTML = `<div class="prefs" role="dialog" aria-modal="true" aria-label="Trip preferences"><div class="prefs-in">
    <div class="story-top" style="color:var(--ink)"><button class="iconbtn" type="button" data-action="${step === 1 ? "back-story" : "prefs-back"}" aria-label="Back">${icon("arrow-left")}</button><span class="brand30" style="font-weight:650">30 Sundays</span><span style="width:40px"></span></div>
    ${inner}
  </div>
  ${step < 3 ? `<div class="dock"><div class="dock-in" style="grid-template-columns:1fr"><button class="btn block" type="button" data-action="${step === 1 ? "prefs-next" : "prefs-gen"}" ${(step === 1 ? t.vibe : t.opt) ? "" : "disabled"}>${step === 1 ? "Next" : "Show our trip"} ${icon("arrow-right")}</button></div></div>` : ""}
  </div>`;
  paint();
  state.prefStep = step;
  if (step === 3) setTimeout(() => { track("trip_preview_generated", { vibe: t.vibe, optimize: t.opt }); openPreview(); }, reduce ? 50 : 1500);
}
function openPreview(){
  const t = state.trip;
  const flightCard = state.wallet.includes("hdfc-regalia") ? "hdfc-regalia" : state.wallet[0];
  const hotelCard = state.wallet.includes("axis-atlas") ? "axis-atlas" : (state.wallet[1] || state.wallet[0]);
  const days = [
    ["Day 1","Arrive + Uluwatu sunset","Cliff-top dinner, early night"],
    ["Day 2","Slow morning + beach", t.opt === "stays" ? "Pool villa day, spa at four" : "Padang Padang, then nothing"],
    ["Day 3","Ubud + food experience", t.vibe === "food" ? "Market walk and a Balinese cooking class" : "Rice terraces, long lunch"],
    ["Day 4","Light adventure", t.vibe === "adventure" ? "Mount Batur sunrise trek" : "Waterfall swim and a slow ride back"],
    ["Day 5","Nothing scheduled until dinner","Then the best table on the island"]
  ];
  const layer = document.getElementById("layer");
  layer.innerHTML = `<div class="prefs preview" role="dialog" aria-modal="true" aria-label="Your Bali trip preview">
    <div class="hero"><div class="scene scene-bali"></div>
      <div class="story-in" style="position:relative;padding-bottom:0"><div class="story-top"><span class="brand30">30 Sundays</span><button class="iconbtn" type="button" data-action="close-story" aria-label="Close">${icon("x")}</button></div></div>
      <div class="hero-in"><h1>BALI</h1><div class="meta">5 nights · For two</div></div>
    </div>
    <div class="preview-body">
      <p class="quote">“${LINES[t.vibe || "mix"].replace("\n","<br>")}”</p>
      <div class="days">${days.map(([d,tt,s]) => `<div class="day"><span class="d">${d}</span><span class="t">${tt}<small>${s}</small></span></div>`).join("")}</div>
      <div class="adv"><h3>Your card advantage</h3>
        <div class="r">${cardHTML(flightCard,{mini:true})}<div><b>${cardFull(flightCard)}</b><span>Flight offer</span></div></div>
        <div class="r">${cardHTML(hotelCard,{mini:true})}<div><b>${cardFull(hotelCard)}</b><span>Hotel benefit</span></div></div>
      </div>
      <div class="pv-actions">
        <button class="btn block" type="button" data-action="go-30s">Continue with 30 Sundays ${icon("arrow-right")}</button>
        <button class="btn ghost block" type="button" data-action="save-idea" aria-pressed="${t.saved}">${icon(t.saved ? "bookmark-check" : "bookmark")} ${t.saved ? "Idea saved" : "Save idea"}</button>
      </div>
      <p class="pv-fine">Itinerary is an illustration for this prototype. Card benefits depend on the offers live when you book.</p>
    </div>
  </div>`;
  paint();
  if (!reduce) layer.firstElementChild.animate([{ opacity:0 },{ opacity:1 }], { duration:400 });
}

/* ================= ACTIONS ================= */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b) return;
  const a = b.dataset.action, id = b.dataset.id;
  switch (a) {
    case "ad-cta": track("ad_cta_clicked"); go("landing"); break;
    case "landing-cta": track("landing_cta_clicked"); go("add"); break;
    case "back": back(); break;
    case "home": go("home"); break;
    case "toggle-card": toggleCard(b); break;
    case "find": if (!state.wallet.length) return; track("wallet_completed", { cards: state.wallet.length }); go("matching"); break;
    case "mode": setMode(b.dataset.mode); break;
    case "why": {
      state.whyOpen = !state.whyOpen;
      if (state.whyOpen) track("why_this_offer_opened", { offer: currentRec().id });
      document.getElementById("whyWrap").classList.toggle("open", state.whyOpen);
      b.textContent = state.whyOpen ? "Hide reasons" : "Why this one?";
      b.setAttribute("aria-expanded", String(state.whyOpen));
      break; }
    case "filter": setFilter(id); break;
    case "wcard": {
      const w = document.getElementById("wallet"); if (w && w._suppress) return;
      if (state.filter === id) openCardSheet(id); else setFilter(id);
      break; }
    case "filter-close": closeSheet(); setFilter(id); break;
    case "remove-card":
      state.wallet = state.wallet.filter(x => x !== id); store.set("wallet", state.wallet);
      track("card_removed", { card: id }); closeSheet();
      if (!state.wallet.length) { go("add"); break; }
      state.filter = "all"; state.mode = "best"; go("home"); toast(`${cardFull(id)} removed`); break;
    case "close-sheet": closeSheet(); break;
    case "go-add": go("add"); break;
    case "all-offers": go("offers"); break;
    case "cat": state.cat = b.dataset.v; document.querySelectorAll('[data-action="cat"]').forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === state.cat))); drawRows(); break;
    case "open-offer": state.offer = OFFERS.find(o => o.id === id); track("offer_selected", { offer: id, from: state.screen }); go("detail"); break;
    case "use": state.offer = OFFERS.find(o => o.id === id); track("offer_selected", { offer: id, cta: "use" }); go("handoff"); break;
    case "use-instead": state.offer = OFFERS.find(o => o.id === id); track("alternative_offer_selected", { offer: id }); go("handoff"); break;
    case "copy": {
      const txt = offerText(state.offer);
      track("offer_details_copied", { offer: state.offer.id });
      const done = () => toast("Offer details copied");
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done)); else fallbackCopy(txt, done);
      break; }
    case "redirect": track("ota_redirect_clicked", { offer: state.offer.id, ota: state.offer.ota }); go("redirect"); break;
    case "come-back": expire(state.offer.id); break;
    case "open-trip": openTrip(); break;
    case "close-story": closeLayer(); break;
    case "build-trip": openPrefs(1); break;
    case "back-story": openTrip(); break;
    case "prefs-back": openPrefs(1); break;
    case "vibe": state.trip.vibe = id; track("trip_preference_selected", { getaway: id }); openPrefs(1); break;
    case "opt": state.trip.opt = id; track("trip_preference_selected", { optimize: id }); openPrefs(2); break;
    case "prefs-next": openPrefs(2); break;
    case "prefs-gen": openPrefs(3); break;
    case "go-30s": track("30sundays_redirect_clicked", { vibe: state.trip.vibe, optimize: state.trip.opt }); toast("This is where the 30 Sundays planner opens"); break;
    case "save-idea": state.trip.saved = !state.trip.saved; openPreview(); if (state.trip.saved) toast("Saved to your ideas"); break;
    case "demo-restart": document.getElementById("evt").classList.remove("show"); closeLayer(); state.hist = []; state.expired = []; go("ad"); break;
    case "demo-expire": {
      document.getElementById("evt").classList.remove("show"); closeLayer();
      if (!state.wallet.length) { state.wallet = DEFAULT_WALLET.slice(); store.set("wallet", state.wallet); }
      const best = picks().best; if (best) expire(best.id); break; }
  }
});
function expire(offerId){
  if (!state.expired.includes(offerId)) state.expired.push(offerId);
  state.deadId = offerId;
  state.filter = "all"; state.mode = "best";
  go("recovery");
}
function fallbackCopy(txt, done){
  const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e) { toast("Select and copy the details above"); }
  ta.remove();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); if (document.querySelector(".story,.prefs")) closeLayer(); document.getElementById("evt").classList.remove("show"); } });
document.getElementById("evtBtn").addEventListener("click", () => document.getElementById("evt").classList.toggle("show"));
document.getElementById("evtClose").addEventListener("click", () => document.getElementById("evt").classList.remove("show"));

renderEvents();
go("ad");
if (!window.lucide) window.addEventListener("load", paint);
})();
</script>
