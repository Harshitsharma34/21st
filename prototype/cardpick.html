<title>30 Sundays Card Offers</title>
<meta name="description" content="Which card to pay with, on which platform, for your flight, and what you will actually save.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Pacifico&display=swap">
<style>
/* Layout: mobile-first single column (390px target); desktop home becomes an asymmetric 1fr / 360px split with the wallet as a side rail. */
:root{
  /* Slash design system: midnight canvas, serif/sans collision, copper accent, gilded gradient on money only.
     Deliberately single-theme (dark). */
  color-scheme: dark;
  --canvas:#08080a; --surface:#040406; --soft:#121317; --border:#1c1d22; --border-2:#2e3038;
  --ink:#ffffff; --body:#e2e3e9; --ink-2:#9194a1; --muted:#5e616e; --steel:#777a88; --mist:#acafb9;
  --action:#ffffff; --on-action:#000000;
  --rec:#cc9166; --rec-soft:rgba(204,145,102,.10);
  --pos:#8fc1a0; --pos-soft:rgba(143,193,160,.10);
  --warn:#d9b26f; --warn-soft:rgba(217,178,111,.09); --danger:#e3928a; --danger-soft:rgba(227,146,138,.10);
  --gilded: linear-gradient(103deg, rgb(174,147,87), rgb(255,240,204) 40%, rgb(174,147,87) 70%, rgb(189,157,79));
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "DM Serif Display", "Playfair Display", Georgia, "Times New Roman", serif;
  --r-btn:9999px; --r-card:10px; --r-hero:10px;
  --spring: cubic-bezier(.34,1.25,.64,1);
  --ease: cubic-bezier(.2,.8,.2,1);
  --gutter:16px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;overflow-x:clip;background:var(--canvas);color:var(--body);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--rec);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-0.035em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.muted{color:var(--ink-2)}
.i{width:1em;height:1em;stroke-width:1.75;vertical-align:-0.14em;flex:none}

#app{position:relative;min-height:100vh}
.screen{min-height:100vh;padding-inline:var(--gutter);padding-block:0 120px;animation:screenIn .32s var(--ease) backwards}
.screen.leaving{animation:screenOut .18s ease both;position:absolute;inset:0;pointer-events:none}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes screenOut{to{opacity:0;transform:translateY(-6px)}}
.wrap{max-width:440px;margin-inline:auto}
.wrap-wide{max-width:1180px;margin-inline:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding-inline:20px;border-radius:var(--r-btn);background:var(--action);color:var(--on-action);font-weight:600;font-size:15.5px;letter-spacing:-0.01em;white-space:nowrap;transition:transform .15s var(--ease),background .2s}
.btn:hover{background:#000}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{height:40px;font-size:14px;padding-inline:14px;border-radius:10px}
.btn[disabled]{background:#cfcfca;cursor:not-allowed}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px;border-bottom:1px solid currentColor;padding-bottom:1px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:650;font-size:17px;letter-spacing:-0.02em}
.brand-mark{position:relative;width:22px;height:18px}
.brand-mark span{position:absolute;width:16px;height:12px;border-radius:3px}
.brand-mark span:first-child{left:0;top:0;background:var(--rec);transform:rotate(-8deg)}
.brand-mark span:last-child{right:0;bottom:0;background:var(--ink)}
.iconbtn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:18px}
.iconbtn:hover{background:var(--soft)}

/* ---------- credit card visual ---------- */
.cc{position:relative;container-type:inline-size;width:var(--w,280px);aspect-ratio:1.586;border-radius:calc(var(--w,280px) * .055);background:var(--bg);color:var(--fg);overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.18),0 10px 24px -14px rgba(17,17,17,.45),0 2px 4px -2px rgba(17,17,17,.2);user-select:none;-webkit-user-select:none}
.cc::before{content:"";position:absolute;inset:0;background:var(--art),radial-gradient(140% 90% at 0% 0%, rgba(255,255,255,.14), transparent 50%),linear-gradient(180deg, transparent 60%, rgba(0,0,0,.14))}
.cc::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.14) 45%,transparent 60%);transform:translateX(-70%);transition:transform .9s var(--ease)}
.cc:hover::after{transform:translateX(70%)}
.cc-glare{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%), rgba(255,255,255,.42), rgba(255,255,255,.08) 28%, transparent 55%);mix-blend-mode:overlay;opacity:0;transition:opacity .35s}
[data-tilt]{perspective:1000px}
[data-tilt] .cc{transform:var(--base,translate(0,0)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .6s var(--spring),box-shadow .4s;will-change:transform}
[data-tilt].tilting .cc{transition:transform .1s linear,box-shadow .4s;box-shadow:0 30px 50px -26px rgba(17,17,17,.6)}
[data-tilt].tilting .cc-glare{opacity:1}
@media (hover:none){ [data-tilt].sway .cc{animation:sway 7s ease-in-out infinite} .sway .cc-glare{opacity:.7;animation:glare 7s ease-in-out infinite} }
@keyframes sway{0%,100%{transform:var(--base,translate(0,0)) rotateX(4deg) rotateY(-9deg)}50%{transform:var(--base,translate(0,0)) rotateX(-3deg) rotateY(9deg)}}
@keyframes glare{0%,100%{opacity:.25}50%{opacity:.8}}
.cc-in{position:absolute;inset:0;z-index:1;padding:7cqw 7.5cqw 6.5cqw;display:grid;grid-template-rows:auto 1fr auto}
.cc-top{display:flex;justify-content:space-between;align-items:center;gap:4cqw;min-height:7cqw}
.cc-bank{display:inline-flex;align-items:center;gap:2.2cqw;white-space:nowrap;font-size:4.7cqw;font-weight:650;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.cc-name{white-space:nowrap;font-size:5.4cqw;font-weight:500;letter-spacing:.01em;opacity:.9;line-height:1;text-align:right}
.cc-logo{width:6cqw;height:6cqw;flex:none}
.cc-logo--icici{color:#f58220}
.cc-mid{display:flex;align-items:center;gap:3.2cqw;align-self:center}
.cc-chip{position:relative;width:12.5cqw;height:9.6cqw;border-radius:1.8cqw;overflow:hidden;
  background:linear-gradient(135deg,#f3e2ad 0%,#c9a75c 38%,#e8cf8c 62%,#b08d45 100%);
  box-shadow:inset 0 0 0 .35cqw rgba(90,64,20,.35),0 .3cqw .6cqw rgba(0,0,0,.25)}
.cc-chip::before{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,transparent 31%,rgba(90,64,20,.38) 31% 34%,transparent 34% 66%,rgba(90,64,20,.38) 66% 69%,transparent 69%),
  linear-gradient(180deg,transparent 32%,rgba(90,64,20,.38) 32% 35%,transparent 35% 65%,rgba(90,64,20,.38) 65% 68%,transparent 68%)}
.cc-chip::after{content:"";position:absolute;left:34%;right:34%;top:35%;bottom:35%;border-radius:.8cqw;border:.35cqw solid rgba(90,64,20,.38)}
.cc-nfc{width:5.4cqw;height:6.4cqw;opacity:.75;flex:none}
.cc-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:3cqw}
.cc-id{display:grid;gap:1.6cqw;min-width:0}
.cc-num{font-size:5cqw;letter-spacing:.16em;font-variant-numeric:tabular-nums;opacity:.9;white-space:nowrap;font-weight:500}
.cc-holder{font-size:3.4cqw;letter-spacing:.16em;text-transform:uppercase;opacity:.65;white-space:nowrap}
.net-visa{display:block;height:6.6cqw;width:19cqw;overflow:hidden;position:relative;flex:none}
.net-visa .net-svg{position:absolute;left:0;top:50%;width:19cqw;height:19cqw;transform:translateY(-50%)}
.net-mc{display:flex;flex:none}.net-mc i{width:8.4cqw;height:8.4cqw;border-radius:50%;display:block}
.net-mc i:first-child{background:#eb001b}.net-mc i:last-child{background:#f79e1b;margin-left:-3.4cqw;mix-blend-mode:screen;opacity:.95}
.net-amex{display:flex;flex-direction:column;justify-content:center;align-items:center;flex:none;width:15cqw;height:15cqw;border-radius:1.2cqw;background:#016fd0;color:#fff;margin-bottom:-.5cqw;box-shadow:0 .4cqw 1cqw rgba(0,0,0,.18)}
.net-amex b{display:block;font-size:2.55cqw;font-weight:800;letter-spacing:-0.01em;line-height:1.05;transform:scaleY(1.15)}
.net-diners .net-svg{width:10cqw;height:10cqw;display:block}
@container (max-width: 170px){ .cc-holder{display:none} .cc-nfc{display:none} }
@container (max-width: 110px){ .cc-num,.cc-chip,.cc-name{display:none} .cc-in{padding:9cqw 10cqw;grid-template-rows:auto 1fr auto} .cc-bank{font-size:11cqw;letter-spacing:.06em} .cc-logo{width:11cqw;height:11cqw} .cc-bot{justify-content:flex-end} .net-visa{height:12cqw;width:34cqw} .net-visa .net-svg{width:34cqw;height:34cqw} .net-amex{width:26cqw;height:26cqw}.net-amex b{font-size:4.4cqw} .net-mc i{width:14cqw;height:14cqw} .net-mc i:last-child{margin-left:-5cqw} .net-diners .net-svg{width:18cqw;height:18cqw} }
.cc.mini .cc-bank span{display:none}.cc.mini .cc-bank span:only-child{display:inline}

/* ---------- OTA mark ---------- */
.ota{--s:40px;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .24);display:inline-grid;place-items:center;flex:none;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px var(--border)}
.ota svg{display:block;flex:none}
.ota--mmt{background:#e31e24;box-shadow:none}
.ota--mmt b{font-family:"Pacifico","Brush Script MT",cursive;font-weight:400;color:#fff;font-size:calc(var(--s) * .5);line-height:1;letter-spacing:-0.02em;transform:translate(1%,-10%)}
.ota--ct{background:#f4621f;box-shadow:none}
.ota--ct svg{width:calc(var(--s) * .62);height:calc(var(--s) * .62)}
.ota--emt svg{width:calc(var(--s) * .74);height:calc(var(--s) * .42);transform:translate(-2%,2%)}
.ota--yt{background:#e1202a;box-shadow:none}
.ota--yt b{color:#fff;font-weight:800;font-size:calc(var(--s) * .58);line-height:1;letter-spacing:-0.05em;transform:translateY(-8%)}
.ota-name{font-weight:600;letter-spacing:-0.015em}

/* ---------- SCREEN 0: AD ---------- */
.ad-stage{display:flex;flex-direction:column;align-items:center;padding-block:28px 40px;gap:14px}
.ad-ctx{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.ig{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.ig-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ig-ava{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--border);display:grid;place-items:center;overflow:hidden}
.ig-ava img{width:28px;height:28px}
.ig-ava .brand-mark{transform:scale(.8)}
.ig-ava .brand-mark span:last-child{background:#fff}
.ig-who{flex:1;line-height:1.2}.ig-who b{font-size:14px;font-weight:600}.ig-who small{display:block;font-size:12px;color:var(--ink-2)}
.ig-media{position:relative;aspect-ratio:4/5;background:#ECECE6;overflow:hidden;display:flex;flex-direction:column;padding:24px 22px 14px}
.ad-copy{flex:none}
.ad-copy h2{font-size:34px;line-height:1.02;letter-spacing:-0.045em}
.ad-copy h2 em{font-style:normal;color:var(--rec)}
.ad-copy p{margin-top:12px;font-size:14.5px;color:#3d3d3a;max-width:28ch}
.ad-vis{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px}
.ad-otas{display:flex;gap:10px;justify-content:center}
.ad-otas .ota{--s:34px;box-shadow:0 6px 14px -10px rgba(0,0,0,.45)}
.ad-fan{position:relative;width:100%;height:158px}
.ad-fan .cc{position:absolute;--w:min(168px,46vw);left:50%;bottom:26px;margin-left:calc(min(168px,46vw) / -2);transform-origin:50% 230%;transition:transform .55s var(--spring),box-shadow .4s,z-index 0s .4s}
.ad-fan .cc.up{transition:transform .55s var(--spring),box-shadow .4s,z-index 0s 0s;box-shadow:0 18px 30px -16px rgba(17,17,17,.55)}
.ad-fine{position:relative;z-index:11;margin-top:0;text-align:center;font-size:11.5px;color:#55554f;display:flex;gap:6px;justify-content:center;align-items:center}
.ig-cta{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;background:var(--ink);color:#fff;font-weight:600;font-size:15px}
.ig-cta:hover{background:#000}
.ig-icons{display:flex;gap:14px;padding:12px 14px 4px;font-size:22px}
.ig-icons span:last-child{margin-left:auto}
.ig-cap{padding:4px 14px 16px;font-size:14px}
.ig-cap b{font-weight:600}

/* ---------- LANDING ---------- */
.land-hero{display:grid;gap:36px;padding-block:28px 40px;align-items:center}
.land-hero h1{font-size:38px;line-height:1.04}
.land-hero .sub{margin-top:16px;font-size:17px;color:var(--ink-2);max-width:40ch}
.land-cta{margin-top:26px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.reassure{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-2)}
.viz{position:relative;height:330px;max-width:100%}
.viz-fan{position:absolute;left:50%;top:8px;width:0}
.viz-fan .cc{position:absolute;--w:190px;left:-95px;transition:transform .5s var(--spring),opacity .3s,filter .3s}
.viz-fan .cc.dim{opacity:.32;filter:saturate(.3)}
.viz-fan .cc.hl{box-shadow:0 0 0 2px var(--rec),0 14px 30px -16px rgba(49,87,245,.7)}
.viz svg.paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.viz svg.paths path{fill:none;stroke:#d6d6d0;stroke-width:1.2;stroke-dasharray:3 4;transition:stroke .25s,opacity .25s}
.viz svg.paths path.on{stroke:var(--rec);stroke-dasharray:none;stroke-width:1.6}
.viz svg.paths path.off{opacity:.25}
.viz-otas{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around}
.viz-ota{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:6px;border-radius:12px;transition:background .2s}
.viz-ota .ota{--s:46px;transition:transform .25s var(--spring)}
.viz-ota:hover .ota,.viz-ota.on .ota{transform:translateY(-3px)}
.viz-ota.on{color:var(--ink)}
.equation{border-top:1px solid var(--border);padding-block:34px;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;font-size:22px;font-weight:600;letter-spacing:-0.03em}
.equation .op{color:var(--muted);font-weight:400}
.equation .res{color:var(--rec)}
.land-foot{font-size:12.5px;color:var(--muted);padding-bottom:24px}

/* ---------- ADD CARDS ---------- */
.add-head{padding-top:8px}
.add-head h1{font-size:36px;line-height:1.05}
.add-head p{margin-top:10px;color:var(--ink-2);font-size:16px}
.search{margin-top:22px;position:relative}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-size:18px}
.search input{width:100%;height:50px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:0 14px 0 42px;font-size:15.5px;outline:none}
.search input::placeholder{color:#7a7a75}
.search input:focus{border-color:var(--ink)}
.grid-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;margin-top:22px}
.tile{display:flex;flex-direction:column;gap:9px;text-align:left;border-radius:14px;padding:0;transition:transform .2s var(--ease)}
.tile .cc{--w:100%;width:100%;transition:transform .35s var(--spring),opacity .3s}
.tile:hover .cc{transform:translateY(-3px)}
.tile.added .cc{transform:scale(.96);box-shadow:0 0 0 2.5px var(--canvas),0 0 0 4.5px var(--ink)}
.tile-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13.5px;min-width:0}
.tile-meta b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-add{font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.tile.added .tag-add{color:var(--pos)}
.empty{padding:40px 0;text-align:center;color:var(--ink-2)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(247,247,244,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:440px;margin-inline:auto;display:grid;gap:10px}
.dock-row{display:flex;align-items:center;gap:12px;min-height:34px}
.dock-stack{display:flex;align-items:center;height:30px;flex:none}
.dock-stack .cc{--w:46px;margin-left:-26px;box-shadow:0 0 0 1.5px var(--canvas)}
.dock-stack .cc:first-child{margin-left:0}
.dock-count{margin-left:6px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
.dock-count b{color:var(--ink)}
.bump{animation:bump .35s var(--spring)}
@keyframes bump{40%{transform:scale(1.18)}}
.dock-note{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;justify-content:center}

/* ---------- MATCHING ---------- */
.match{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:440px;margin-inline:auto;padding-block:30px}
.match-board{position:relative;height:380px;margin-top:10px}
.match-board > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.match-board line{stroke:#d2d2cc;stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .6s var(--ease),stroke .3s,opacity .4s,stroke-width .3s}
.match-board line.drawn{stroke-dashoffset:0}
.match-board line.hit{stroke:var(--rec)}
.match-board line.win{stroke:var(--ink);stroke-width:2.4}
.match-board line.fade{opacity:.12}
.m-cards{position:absolute;left:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around}
.m-cards .cc{--w:var(--mw,118px);transition:transform .4s var(--spring),opacity .4s}
.m-otas{position:absolute;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;align-items:flex-end}
.m-ota{width:84px;display:flex;flex-direction:column-reverse;align-items:center;gap:5px;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-2);transition:opacity .4s}
.m-ota .ota{--s:44px}
.m-badge{position:absolute;transform:translate(-50%,-50%) scale(.6);opacity:0;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:650;padding:3px 7px;border-radius:7px;transition:opacity .25s,transform .35s var(--spring);font-variant-numeric:tabular-nums;white-space:nowrap}
.m-badge.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.m-badge.win{background:var(--ink);color:#fff;border-color:var(--ink)}
.m-status{min-height:64px}
.m-status h2{font-size:26px;line-height:1.1}
.m-status p{margin-top:6px;color:var(--ink-2);font-size:14px}
.m-step{animation:stepIn .3s var(--ease) both}
@keyframes stepIn{from{opacity:0;transform:translateY(6px)}}
.m-count{display:flex;gap:28px;margin-top:22px;border-top:1px solid var(--border);padding-top:16px}
.m-count div{font-size:12px;color:var(--ink-2)}
.m-count b{display:block;font-size:26px;font-weight:650;color:var(--ink);letter-spacing:-0.03em;font-variant-numeric:tabular-nums}

/* ---------- HOME ---------- */
.home-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:8px}
.greet b{display:block;font-size:15px;font-weight:600}
.greet small{font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.home-h1{font-size:30px;line-height:1.08;margin-top:22px}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-top:16px;grid-template-areas:"main" "wallet" "alts" "trip"}
.g-main{grid-area:main;min-width:0;container:recbox / inline-size}.g-wallet{grid-area:wallet;min-width:0}.g-alts{grid-area:alts;min-width:0}.g-trip{grid-area:trip;min-width:0}

.modes{display:flex;gap:20px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.modes button{position:relative;padding:8px 0 11px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .2s}
.modes button[aria-selected="true"]{color:var(--ink)}
.modes button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.modes-ctx{font-size:13.5px;font-weight:600;padding:8px 0 11px;color:var(--ink);display:flex;align-items:center;gap:8px}
.modes-ctx button{color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center;gap:4px}

.rec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-hero);overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s var(--ease);box-shadow:0 1px 2px rgba(17,17,17,.03),0 12px 32px -26px rgba(17,17,17,.35);touch-action:pan-y}
.rec:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(17,17,17,.04),0 18px 40px -26px rgba(17,17,17,.4)}
.rec-strip{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--rec-soft);color:#1f3dbd;font-size:12.5px;font-weight:600}
.rec-strip span{display:inline-flex;gap:6px;align-items:center}
.rec-strip .r{color:#2b46c8;font-weight:500}
.rec-body{padding:18px 18px 18px}
.rec-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rec-ota{display:flex;gap:11px;align-items:center;min-width:0}
.rec-ota .ota{--s:46px;transition:transform .25s var(--ease),filter .25s;filter:saturate(.85)}
.rec-ota:hover .ota{transform:scale(1.04);filter:none}
.rec-ota small{display:block;font-size:12.5px;color:var(--ink-2)}
.rec-ota .ota-name{font-size:16px;display:block}
.rec-cardslot{position:relative;margin-right:-30px;margin-top:-4px;transition:transform .45s var(--spring)}
.rec-cardslot .cc{--w:118px;transform:rotate(4deg)}
.rec:hover .rec-cardslot{transform:translateX(-16px) translateY(-2px)}
.rec-benefit{margin-top:18px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.big{font-size:68px;line-height:.86;font-weight:650;letter-spacing:-0.055em;font-variant-numeric:tabular-nums}
.big-u{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:650;line-height:1.3;padding-bottom:4px}
.cap{font-size:15px;color:var(--ink-2);margin-top:8px}
.cap b{color:var(--ink);font-weight:600}
.use-line{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14.5px}
.use-line b{font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:16px;border-radius:12px;overflow:hidden;background:var(--border)}
.facts div{background:var(--soft);padding:10px 12px;min-width:0}
.facts dt{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.facts dd{margin:3px 0 0;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.elig{display:inline-flex;gap:7px;align-items:center;margin-top:14px;font-size:13.5px;font-weight:600;color:var(--pos)}
.elig .dotc{width:20px;height:20px;border-radius:50%;background:var(--pos-soft);display:grid;place-items:center;font-size:12px}
.rec-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:18px}
.why-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.why-wrap.open{grid-template-rows:1fr}
.why-wrap > div{overflow:hidden;min-height:0}
.why{border-top:1px dashed var(--border);margin-top:18px;padding-top:16px;opacity:0;transform:translateY(-6px);transition:opacity .3s .1s,transform .4s var(--ease) .05s}
.why-wrap.open .why{opacity:1;transform:none}
.why ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.why li{display:flex;gap:9px;font-size:14px;align-items:flex-start}
.why li .i{color:var(--pos);margin-top:2px}
.checked{margin-top:14px;font-size:13px;color:var(--ink-2)}
.nextbest{margin-top:12px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--soft)}
.nextbest .t{flex:1;min-width:0;font-size:13.5px}
.nextbest .t b{font-weight:600}
.nextbest .t small{display:block;color:var(--ink-2);font-size:12.5px}
.why-foot{display:flex;justify-content:flex-end;margin-top:14px}
.save{margin-top:18px}
.save-h{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:650}
.save-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px;background:var(--soft);border-radius:14px;overflow:hidden}
.sv{display:flex;flex-direction:column;gap:4px;min-width:0;padding:12px 14px}
.sv + .sv{border-left:1px solid var(--border)}
.sv-k{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sv b{font-size:22px;font-weight:650;letter-spacing:-0.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.sv-n{font-size:12px;font-weight:600;color:var(--pos)}
.sv.full .sv-n{color:#1f3dbd}
.sv.no b{color:var(--muted)}
.sv.no .sv-n{color:var(--warn)}
@media (max-width:380px){ .sv{padding:10px} .sv b{font-size:19px} .sv-k{font-size:12px} }
.rec-visual{display:none;position:relative;flex-direction:column;justify-content:space-between;gap:18px;border-radius:18px;padding:20px;overflow:hidden;background:radial-gradient(110% 70% at 50% 0%, var(--rec-soft) 0%, transparent 70%), var(--soft);isolation:isolate}
.rv-glow{position:absolute;left:12%;right:12%;top:26%;height:130px;background:var(--cbg);filter:blur(46px);opacity:.28;z-index:-1;border-radius:50%}
.cat{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:3px 8px 3px 6px;border-radius:999px;background:var(--rec-soft);color:#1f3dbd;font-size:12px;font-weight:600;line-height:1.3;width:max-content}
.cat .i{font-size:13px}
.cat.sm{margin-top:0;padding:2px 7px 2px 5px;font-size:11px}
.cat.sm .i{font-size:11.5px}
.alt-k{display:flex;justify-content:space-between;align-items:center;gap:8px}
.alt .alt-v b{color:var(--pos)}
.alt-why .i{flex:none;margin-top:2px}
.rv-cat{position:absolute;left:18px;top:44px;font-size:120px;color:#1f3dbd;opacity:.07;transform:rotate(-12deg);pointer-events:none;z-index:-1;line-height:1}
.rv-cat .i{stroke-width:1.2}
.rv-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2)}
.rv-top span{display:inline-flex;gap:6px;align-items:center}
.rv-stage{position:relative;flex:1;min-height:210px;display:grid;place-items:center}
.rv-stage .cc{--w:212px;--base:translate(-10px,22px) rotate(-8deg);box-shadow:0 26px 40px -24px rgba(17,17,17,.6),0 2px 6px -2px rgba(17,17,17,.25)}
.rec:hover .rv-stage .cc{--base:translate(2px,14px) rotate(-4deg)}
.rv-stage .ota{--s:54px;position:absolute;right:4px;top:calc(50% - 104px);z-index:2;box-shadow:0 0 0 5px var(--soft),0 12px 24px -14px rgba(17,17,17,.5);transition:transform .35s var(--spring)}
.rec:hover .rv-stage .ota{transform:translate(4px,-4px) scale(1.04)}
.rv-plus{position:absolute;right:58px;top:20px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;color:var(--ink-2);z-index:1}
.rv-cap{display:grid;gap:2px}
.rv-cap b{font-size:17px;font-weight:600;letter-spacing:-0.02em}
.rv-cap span{font-size:13.5px;color:var(--ink-2)}
.swipe-hint{display:flex;justify-content:center;gap:5px;margin-top:12px}
.swipe-hint i{width:6px;height:6px;border-radius:3px;background:#d6d6d0;transition:width .25s,background .25s}
.swipe-hint i.on{width:18px;background:var(--ink)}

/* wallet */
.wal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.wal-head h3{font-size:17px;letter-spacing:-0.02em}
.wal-head small{font-size:12.5px;color:var(--ink-2)}
.wallet{position:relative;display:flex;align-items:flex-end;height:112px;padding-top:14px;touch-action:pan-y;cursor:grab;overflow-x:clip;overflow-y:visible}
.wallet:active{cursor:grabbing}
.wslot{position:relative;flex:none;margin-left:-82px;transition:transform .42s var(--spring),margin .42s var(--spring),filter .3s;transform-origin:50% 100%}
.wslot:first-child{margin-left:0}
.wslot .cc{--w:112px}
.wslot > button:not(.wall){display:block;border-radius:8px}
.wslot.dim{transform:scale(.97);filter:brightness(.92)}
.wslot.active{transform:translateY(-12px);z-index:30 !important}
.wslot.active + .wslot{margin-left:-40px}
.wall{width:64px;height:71px;border-radius:9px;border:1.5px solid var(--ink);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;padding:9px;text-align:left;font-size:12px;font-weight:600}
.wall .stk{display:block;position:relative;height:22px;width:40px;flex:none}
.wall .stk i{position:absolute;width:26px;height:17px;border-radius:3px;border:1.5px solid var(--ink);background:var(--surface)}
.wall .stk i:nth-child(1){left:0;top:4px}.wall .stk i:nth-child(2){left:6px;top:2px}.wall .stk i:nth-child(3){left:12px;top:0;background:var(--ink)}
.wslot.allslot{margin-right:12px}
.wslot.allslot:not(.active) .wall{border-color:var(--border);color:var(--ink-2)}
.wslot.allslot:not(.active) .wall .stk i{border-color:#b9b9b2}
.wslot.allslot:not(.active) .wall .stk i:nth-child(3){background:#b9b9b2}
.wslot.allslot + .wslot{margin-left:0}
.wslot.addslot button{width:58px;height:83px;border-radius:9px;border:1.5px dashed #c9c9c2;display:grid;place-items:center;color:var(--ink-2);font-size:20px;background:transparent}
.wslot.addslot{display:none}
.wal-add{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.wal-tip{font-size:12px;color:var(--muted);margin-top:8px}

/* alternatives */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-h h3{font-size:17px;letter-spacing:-0.02em}
.alts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,82%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:calc(var(--gutter) * -1);padding-inline:var(--gutter);scrollbar-width:none}
.alt{scroll-snap-align:start;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:15px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s,transform .2s var(--ease)}
.alt:hover{border-color:#cfcfc9;transform:translateY(-2px)}
.alt-k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:650;color:var(--ink-2)}
.alt-pair{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.alt-pair .x{color:var(--muted);font-weight:400}
.alt-pair .cc{--w:44px}
.alt-pair .ota{--s:30px}
.alt-v{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.alt-v b{font-size:26px;font-weight:650;letter-spacing:-0.04em}
.alt-v span{font-size:13px;color:var(--ink-2)}
.alt-why{font-size:13px;color:var(--ink-2);border-top:1px solid var(--border);padding-top:10px;display:flex;gap:7px;align-items:flex-start}
.chip-later{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:6px}
.alt.more{justify-content:space-between;background:var(--soft);border-style:dashed}
.alt.more b{font-size:18px;letter-spacing:-0.02em;font-weight:600}

/* trip teaser */
.trip{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:190px auto;border-radius:var(--r-hero);overflow:hidden;background:#101b25;color:#fff;text-align:left;width:100%;isolation:isolate}
.trip-r{position:relative;grid-row:1;overflow:hidden}
.trip-l{position:relative;grid-row:2;padding:22px 20px 0;min-height:270px;overflow:hidden;background:#101b25}
.trip-k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:650;color:rgba(255,255,255,.88)}
.trip h3{font-size:40px;line-height:1;letter-spacing:-0.045em;margin-top:10px;font-weight:650}
.trip-sub{font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.78);max-width:30ch;margin-top:12px}
.trip-stack{position:absolute;left:18px;bottom:-34px;width:210px;height:150px;pointer-events:none}
.trip-stack .cc{position:absolute;left:0;bottom:0;--w:190px;transition:transform .5s var(--spring)}
.trip-stack .cc:first-child{transform:translate(34px,-10px) rotate(-8deg);opacity:.9}
.trip-stack .cc:last-child{transform:rotate(-2deg);box-shadow:0 18px 34px -16px rgba(0,0,0,.7)}
.trip:hover .trip-stack .cc:first-child{transform:translate(46px,-18px) rotate(-11deg)}
.trip:hover .trip-stack .cc:last-child{transform:translateY(-6px) rotate(-1deg)}
.trip-go{position:absolute;right:16px;bottom:22px;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:9px;background:#fff;color:#111;font-weight:600;font-size:14px;white-space:nowrap;box-shadow:0 8px 20px -12px rgba(0,0,0,.6);transition:transform .2s var(--ease)}
.trip:hover .trip-go{transform:translateX(2px)}
.trip-chips{position:absolute;right:16px;top:16px;display:flex;gap:8px;z-index:2}
.trip-chips span{font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.logo30{display:block;height:34px;width:auto;flex:none}
@media (max-width:899px){
  .trip-l{min-height:300px;padding-bottom:24px}
  .trip-go{position:relative;right:auto;bottom:auto;margin-top:18px}
  .trip-stack{left:auto;right:-18px;bottom:-40px}
  .trip-stack .cc{--w:170px}
}
.trip-r .logo30{position:absolute;right:18px;bottom:16px;z-index:2;height:38px;filter:drop-shadow(0 1px 8px rgba(0,0,0,.35))}
.scene{position:absolute;inset:0}
.scene-bali{background:
  radial-gradient(18% 13% at 72% 52%, #ffe9b8 0%, #ffc978 40%, rgba(255,170,90,0) 100%),
  linear-gradient(180deg,#2c3f64 0%,#7d6b8e 26%,#e59a7c 46%,#f6c48d 54%,#3f5d73 55%,#24414f 72%,#12232c 100%)}
.scene-bali::before{content:"";position:absolute;left:0;right:0;top:55%;bottom:0;background:repeating-linear-gradient(180deg,rgba(255,214,160,.16) 0 1px,transparent 1px 9px);mask-image:linear-gradient(90deg,transparent 40%,#000 72%,transparent 96%);-webkit-mask-image:linear-gradient(90deg,transparent 40%,#000 72%,transparent 96%)}
.scene-bali::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,24,0) 55%,rgba(10,16,24,.35) 100%)}

/* ---------- ALL OFFERS ---------- */
.ctrl{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--canvas);margin-inline:calc(var(--gutter) * -1);padding:10px var(--gutter);border-bottom:1px solid var(--border)}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none;max-width:440px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);padding:0 10px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(17,17,17,.08)}
.rows{margin-top:6px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--border);transition:background .2s}
.row:hover{background:linear-gradient(90deg,transparent,var(--soft) 10%,var(--soft) 90%,transparent)}
.row .ota{--s:40px}
.row-main{min-width:0}
.row-main .o{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.row-main .v{font-size:16px;font-weight:650;letter-spacing:-0.02em;margin-top:1px}
.row-main .v span{font-weight:500;color:var(--ink-2);font-size:13.5px;letter-spacing:0}
.row-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);margin-top:5px}
.row-meta .cc{--w:34px;box-shadow:none}
.row-end{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tagx{font-size:11px;font-weight:650;padding:3px 7px;border-radius:6px;white-space:nowrap}
.tagx.best{background:var(--rec-soft);color:#1f3dbd}
.tagx.soon{background:var(--warn-soft);color:var(--warn)}
.tagx.cb{background:var(--soft);color:var(--ink-2)}
.row-desk{display:none}

/* ---------- DETAIL ---------- */
.det-hero{display:flex;align-items:center;gap:14px;margin-top:10px}
.det-hero .x{color:var(--muted);font-size:20px}
.det-hero .ota{--s:56px}
.det-hero .cc{--w:110px}
.det-title{margin-top:18px;font-size:15px;color:var(--ink-2)}
.det-title b{color:var(--ink);font-weight:600}
.det-big{display:flex;align-items:flex-end;gap:12px;margin-top:10px}
.det-big .big{font-size:84px}
.ladder{margin-top:26px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:6px 16px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;position:relative;opacity:.25;transition:opacity .35s}
.step.in{opacity:1}
.step + .step{border-top:1px solid var(--border)}
.step .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.step .v{font-size:15px;font-weight:600}
.step .ck{width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--muted);transition:background .3s,color .3s}
.step.in .ck{background:var(--pos-soft);color:var(--pos)}
.step .n{font-size:12.5px;color:var(--ink-2);text-align:right}
.result{margin-top:12px;display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:var(--r-card);background:var(--pos-soft);color:var(--pos);font-weight:650;letter-spacing:.04em;font-size:13.5px;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s var(--ease)}
.result.in{opacity:1;transform:none}
.cond{margin-top:16px;border-top:1px solid var(--border)}
.cond summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-weight:600;font-size:14.5px}
.cond summary::-webkit-details-marker{display:none}
.cond[open] summary .i{transform:rotate(180deg)}
.cond summary .i{transition:transform .25s}
.cond ul{margin:0 0 12px;padding-left:18px;color:var(--ink-2);font-size:14px;display:grid;gap:6px}
.lastchk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);margin-top:6px}

/* ---------- HANDOFF ---------- */
.ho{max-width:520px;margin-inline:auto;padding-top:10px}
.ho-anim{position:relative;height:150px;overflow:visible}
.ho-anim .ota{--s:64px;position:absolute;left:50%;top:50%;margin:-32px 0 0 -32px;z-index:2;box-shadow:0 12px 28px -16px rgba(17,17,17,.45)}
.ho-anim .cc{--w:120px;position:absolute;top:50%;right:calc(50% + 52px);margin-top:-38px;z-index:1}
.ho-ready{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--pos);display:flex;gap:6px;align-items:center}
.ho h1{font-size:32px;line-height:1.08;margin-top:8px}
.ho-to{display:flex;align-items:center;gap:12px;margin-top:14px}
.ho-to .ota{--s:48px}
.ho-to b{font-size:20px;font-weight:600;letter-spacing:-0.02em}
.remember{margin-top:26px;position:relative}
.remember .tiltw{position:relative;z-index:1;margin:0 4% -70px;padding-top:6px}
.remember .cc{--w:100%;width:100%;box-shadow:0 30px 50px -28px rgba(17,17,17,.55),0 2px 6px -2px rgba(17,17,17,.2)}
.remember-box{position:relative;z-index:2;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px 18px 18px;box-shadow:0 16px 40px -28px rgba(17,17,17,.4)}
.remember-box .v{font-size:24px;font-weight:650;letter-spacing:-0.03em;margin-top:6px}
.remember-box .c{color:var(--ink-2)}
.remember-box dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--border)}
.remember-box dt{font-size:12.5px;color:var(--ink-2)}
.remember-box dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.note{display:flex;gap:9px;align-items:flex-start;margin-top:16px;font-size:13.5px;color:var(--ink-2)}
.note .i{color:var(--warn);margin-top:2px}
.ho-actions{display:grid;gap:10px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;transition:opacity .2s,transform .3s var(--spring);z-index:60;display:flex;gap:8px;align-items:center;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* redirect sim */
.browser{max-width:440px;margin:18px auto 0;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface)}
.b-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--soft);font-size:13px;color:var(--ink-2)}
.b-url{flex:1;background:var(--surface);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.b-prog{height:2px;background:var(--rec);width:0;animation:prog 1.8s var(--ease) forwards}
@keyframes prog{to{width:100%}}
.b-body{padding:20px;display:grid;gap:12px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--soft) 0%,#e9e9e4 50%,var(--soft) 100%);background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.pin{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px}
.pin .cc{--w:46px;box-shadow:none}
.pin b{font-weight:600}

/* recovery */
.dead{position:relative;transform-origin:50% 0;transition:transform .5s var(--ease),opacity .5s,filter .5s}
.dead.collapse{transform:scaleY(.6) translateY(-10px);opacity:.35;filter:grayscale(1)}
.dead .rec:hover{transform:none}
.ended{display:inline-flex;align-items:center;gap:7px;color:var(--danger);font-weight:600;font-size:14px;margin-top:6px}
.next-in{animation:riseIn .55s var(--ease) both}
@keyframes riseIn{from{opacity:0;transform:translateY(24px)}}

/* ---------- 30 SUNDAYS ---------- */
.story{position:fixed;inset:0;z-index:40;background:#0d1620;color:#fff;overflow-y:auto}
.story .scene{position:fixed}
.story-in{position:relative;max-width:560px;margin-inline:auto;padding:calc(18px + env(safe-area-inset-top,0px)) var(--gutter) 60px}
.story-top{display:flex;justify-content:space-between;align-items:center;height:48px}
.story{--c:#fff}
.story .iconbtn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}
.st-k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:650;opacity:.85}
.st-h{font-size:64px;line-height:.9;letter-spacing:-0.055em;font-weight:650;margin-top:14px}
.st-sub{font-size:17px;opacity:.85;margin-top:12px}
.st-list{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:4px;font-size:22px;font-weight:500;letter-spacing:-0.02em}
.st-list li{opacity:0;animation:fadeUp .5s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.glass{background:rgba(8,14,22,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:18px}
.why-now{margin-top:34px;display:grid;gap:12px}
.why-now .row2{display:flex;align-items:center;gap:12px;font-size:14.5px}
.why-now .row2 .cc{--w:52px;box-shadow:none}
.why-now .row2 span{opacity:.75;display:block;font-size:13px}
.why-now .row2 .ico{width:52px;display:grid;place-items:center;font-size:20px;opacity:.9}
.st-q{font-size:24px;line-height:1.15;letter-spacing:-0.03em;font-weight:600;margin-top:34px}
.btn.light{background:#fff;color:#111}
.btn.light:hover{background:#f1f1ee}
.btn.ghost-l{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff}
.prefs{position:fixed;inset:0;z-index:41;background:var(--canvas);overflow-y:auto}
.prefs-in{max-width:560px;margin-inline:auto;padding:calc(10px + env(safe-area-inset-top,0px)) var(--gutter) 120px}
.prefs h2{font-size:32px;line-height:1.05;margin-top:12px}
.choices{display:grid;gap:10px;margin-top:20px}
.choice{position:relative;height:96px;border-radius:16px;overflow:hidden;color:#fff;text-align:left;padding:16px;display:flex;align-items:flex-end;justify-content:space-between;font-weight:650;font-size:17px;letter-spacing:.02em;transition:transform .3s var(--spring),box-shadow .25s}
.choice .bg{position:absolute;inset:0;transition:transform .6s var(--ease)}
.choice .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.42),transparent 75%)}
.choice span:not(.bg){text-shadow:0 1px 10px rgba(0,0,0,.3)}
.choice:hover .bg{transform:scale(1.04)}
.choice span{position:relative}
.choice .ck{position:relative;width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);display:grid;place-items:center;transition:background .2s}
.choice.sel{box-shadow:0 0 0 3px var(--ink);transform:scale(.985)}
.choice.sel .ck{background:#fff;color:#111;border-color:#fff}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.opt{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px;text-align:left;transition:border-color .2s,transform .3s var(--spring)}
.opt b{display:block;font-size:15.5px;font-weight:600}
.opt small{color:var(--ink-2);font-size:13px}
.opt .i{font-size:20px;margin-bottom:12px}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);transform:scale(.985)}
.gen{min-height:60vh;display:grid;place-items:center;text-align:center}
.gen p{color:var(--ink-2);margin-top:8px}
.gen-bar{width:180px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin:18px auto 0}
.gen-bar i{display:block;height:100%;background:var(--ink);width:0;animation:prog 1.4s var(--ease) forwards}
.preview .hero{position:relative;height:62vh;min-height:380px;max-height:560px;overflow:hidden;color:#fff}
.preview .hero-in{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin-inline:auto;padding:0 var(--gutter) 26px}
.preview .hero h1{font-size:76px;line-height:.86;letter-spacing:-0.06em;font-weight:650}
.preview .hero .meta{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:650;margin-top:12px;opacity:.9}
.preview-body{max-width:560px;margin-inline:auto;padding:26px var(--gutter) 60px}
.quote{font-size:22px;line-height:1.3;letter-spacing:-0.025em;font-weight:500}
.days{margin-top:28px;display:grid}
.day{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--border);align-items:baseline}
.day .d{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:650;color:var(--ink-2)}
.day .t{font-size:17px;font-weight:600;letter-spacing:-0.02em}
.day .t small{display:block;font-weight:400;color:var(--ink-2);font-size:13.5px;letter-spacing:0;margin-top:2px}
.adv{margin-top:26px;padding:16px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--border)}
.adv h3{font-size:15px;letter-spacing:-0.01em}
.adv .r{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:14px}
.adv .r .cc{--w:52px;box-shadow:none}
.adv .r span{display:block;color:var(--ink-2);font-size:12.5px}
.pv-actions{display:grid;gap:10px;margin-top:24px}
.pv-fine{font-size:12px;color:var(--muted);margin-top:14px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(17,17,17,.35);z-index:50;opacity:0;transition:opacity .25s}
.sheet-bg.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:20px 20px 0 0;padding:10px var(--gutter) calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .38s var(--ease);max-width:520px;margin-inline:auto}
.sheet.show{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px}
.sheet .cc{--w:min(300px,80vw);margin-inline:auto}
.sheet h3{font-size:22px;margin-top:18px}
.sheet .sub{color:var(--ink-2);font-size:14px;margin-top:4px}
.sheet-list{margin-top:14px;display:grid;gap:8px}
.sheet-list button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--soft);text-align:left;width:100%}
.sheet-list .ota{--s:34px}
.sheet-list .t{flex:1;font-size:14px}
.sheet-list .t b{font-weight:600}
.sheet-list .t small{display:block;color:var(--ink-2);font-size:12.5px}

/* events panel */
.evt-btn{position:fixed;right:0;top:38%;z-index:70;height:32px;padding:0 8px 0 10px;border-radius:9px 0 0 9px;border-right:0 !important;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;box-shadow:0 6px 18px -12px rgba(0,0,0,.4)}
.evt-t{display:none}
.evt-btn b{background:var(--rec);color:#fff;border-radius:5px;padding:1px 6px;font-size:11px;font-variant-numeric:tabular-nums}
body.has-dock .screen{padding-bottom:190px}

.evt{position:fixed;right:12px;top:12px;bottom:12px;width:min(360px,calc(100vw - 24px));z-index:71;background:var(--surface);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateY(12px) scale(.98);transform-origin:100% 100%;transition:opacity .2s,transform .3s var(--ease),visibility 0s .3s;box-shadow:0 30px 60px -30px rgba(0,0,0,.4)}
.evt.show{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .3s var(--ease)}
.evt-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.evt-h b{font-size:15px}
.evt-funnel{padding:12px 16px;border-bottom:1px solid var(--border);display:grid;gap:7px;font-size:12.5px}
.evt-funnel div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.evt-funnel span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.evt-funnel .ok{color:var(--pos)}
.evt-list{flex:1;overflow-y:auto;padding:8px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.evt-list div{padding:6px 0;border-bottom:1px solid var(--soft);display:grid;gap:2px}
.evt-list .n{color:var(--ink);font-weight:600}
.evt-list .p{color:var(--ink-2);word-break:break-word}
.evt-demo{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px}

/* ---------- desktop ---------- */
@media (min-width:900px){
  :root{--gutter:40px}
  .land-hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);padding-block:56px 64px;gap:48px}
  .land-hero h1{font-size:52px}
  .viz{height:400px}
  .viz-fan .cc{--w:230px;left:-115px}
  .equation{font-size:28px}
  .home-h1{font-size:44px}
  .home-grid{grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"main wallet" "alts alts" "trip trip";gap:36px 40px}

  .g-wallet{padding:20px;border:1px solid var(--border);border-radius:var(--r-hero);background:var(--surface);align-self:start}
  .wallet{flex-direction:column;align-items:stretch;height:auto;padding-top:0;cursor:default}
  .wslot{margin-left:0 !important;margin-top:-126px;transform-origin:50% 0}
  .wslot:first-child{margin-top:0}
  .wslot .cc{--w:100%;width:100%}
  .wslot > button{width:100%}
  .wall{width:100%}
  .wal-add{display:none}
  .wslot.allslot{margin-right:0;margin-bottom:14px}
  .wslot.allslot + .wslot{margin-top:0}
  .wall{width:100%;height:auto;flex-direction:row;align-items:center;gap:12px;padding:12px;justify-content:flex-start}
  .wslot.active{transform:translateX(-10px)}
  .wslot.active:not(.allslot) + .wslot{margin-top:-24px}
  .wslot.dim{transform:scale(.98)}
  .wslot.addslot{display:block;margin-top:12px}
  .wslot.addslot button{width:100%;height:46px;font-size:14px;gap:6px;display:flex;align-items:center;justify-content:center}
  .wal-tip{margin-top:12px}
  .alts{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;margin-inline:0;padding-inline:0}
  .trip{grid-template-columns:41.5% minmax(0,1fr);grid-template-rows:auto;min-height:290px}
  .trip-l{grid-row:1;grid-column:1;padding:28px 26px 0;min-height:290px}
  .trip-r{grid-row:1;grid-column:2}
  .trip h3{font-size:52px}
  .trip-stack{left:20px;bottom:-30px}
  .trip-stack .cc{--w:210px}
  .trip-go{right:18px;bottom:26px}
  .trip-chips{right:22px;top:20px}
  .trip-r .logo30{right:22px;bottom:20px}
  .grid-cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .wrap-add{max-width:720px}
  .dock-in{max-width:720px;grid-template-columns:1fr auto;align-items:center}
  .dock-note{grid-column:1 / -1}
  .row-desk{display:block;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .row{grid-template-columns:44px minmax(0,1.3fr) 140px 110px 110px 24px;padding:16px 8px}
  .row-meta{margin-top:0}
  .row .mob{display:none}
  .seg{max-width:520px}
  .st-h{font-size:96px}
  .preview .hero h1{font-size:120px}
  .choices{grid-template-columns:1fr 1fr}
  .choice:last-child{grid-column:1 / -1}
}

/* ---------- ROUTE INPUT ---------- */
.rt-h{font-size:34px;line-height:1.05;margin-top:6px}
.rt-fields{position:relative;display:grid;gap:8px;margin-top:22px}
.rt-f{display:grid;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 64px 10px 14px;cursor:pointer}
.rt-f .k{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:650}
.rt-f select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;font-size:21px;font-weight:650;letter-spacing:-0.02em;color:var(--ink);padding:2px 0;outline:none;width:100%;cursor:pointer}
.rt-f:focus-within{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rt-swap{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:18px;z-index:1;box-shadow:0 4px 12px -8px rgba(0,0,0,.3)}
.rt-quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px}
.rt-quick button{padding:6px 10px;border-radius:8px;background:var(--soft);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.rt-quick button:hover{background:#e8e8e3}
.rt-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:24px}
.dates{display:grid;grid-auto-flow:column;grid-auto-columns:62px;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:6px;scrollbar-width:none;margin-inline:calc(var(--gutter) * -1);padding-inline:var(--gutter);scroll-snap-type:x proximity}
.date{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0;border-radius:12px;border:1px solid var(--border);background:var(--surface);scroll-snap-align:center;transition:background .2s,transform .2s var(--spring)}
.date small{font-size:11.5px;color:var(--ink-2);font-weight:600}
.date b{font-size:19px;font-weight:650;letter-spacing:-0.02em}
.date span{font-size:11px;color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.date.on{background:var(--ink);border-color:var(--ink);color:#fff;transform:translateY(-2px)}
.date.on small,.date.on span{color:rgba(255,255,255,.8)}
.pax{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.pax b{font-size:22px;min-width:22px;text-align:center;font-weight:650}
.pax small{flex-basis:100%;color:var(--ink-2);font-size:12.5px}
.rt-cta{margin-top:28px;display:flex;flex-direction:column;align-items:center}

/* ---------- RESULTS ---------- */
.route-pill{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:14px;text-align:left;margin-top:4px}
.route-pill span{flex:1;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.route-pill b{font-size:13px;color:var(--rec);font-weight:600}
.scan{margin-top:12px;font-size:13.5px;color:var(--ink-2);max-width:66ch}
.scan b{color:var(--ink);font-weight:600}
.s-use{color:var(--pos);font-weight:600}.s-catch{color:var(--warn);font-weight:600}.s-no{color:var(--danger);font-weight:600}
.v-h{font-size:29px;line-height:1.12;letter-spacing:-0.035em;margin-top:18px;font-weight:500}
.v-h b{font-weight:650}
.v-sub{margin-top:8px;font-size:15px;color:var(--ink-2);max-width:60ch}
.v-sub b{color:var(--ink);font-weight:600}
.g-main .rec{margin-top:16px}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;grid-template-areas:"main" "catch" "also" "cards" "miss" "trip"}
.res-grid.res-none{grid-template-areas:"main" "cards" "miss"}
.g-catch{grid-area:catch;min-width:0}.g-also{grid-area:also;min-width:0}.g-cards{grid-area:cards;min-width:0}.g-miss{grid-area:miss;min-width:0}
.g-cards .wal-add{display:inline-flex}
.rec-strip{align-items:center;background:var(--surface);border-bottom:1px solid var(--border);color:var(--ink-2)}
.rec-strip .r{color:var(--ink-2);font-weight:500}
.cert{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:4px 10px 4px 8px;border-radius:999px;white-space:nowrap;line-height:1.2}
.cert .i{font-size:14px}
.cert--sure{background:var(--pos-soft);color:var(--pos)}
.cert--likely,.cert--catch{background:var(--warn-soft);color:var(--warn)}
.cert--depends{background:var(--rec-soft);color:#1f3dbd}
.cert--no{background:#fdecea;color:var(--danger)}
.air{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font-size:12.5px;font-weight:600;color:var(--ink)}
.air i{width:8px;height:8px;border-radius:2px;background:var(--ac);transform:rotate(45deg);flex:none}
.pay{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 28px;align-items:end;margin-top:18px}
.pay .k{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:650;margin-bottom:6px}
.pay-save .big{color:var(--pos);font-size:60px}
.pay-net b{font-size:26px;font-weight:650;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.pay-net s{margin-left:8px;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.adv{display:flex;gap:9px;align-items:flex-start;margin-top:16px;font-size:13.5px;color:var(--ink-2);background:var(--soft);padding:10px 12px;border-radius:10px}
.adv b{color:var(--ink);font-weight:600}
.adv .i{margin-top:2px;flex:none}
.conds{margin-top:18px}
.conds-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:650}
.conds-h small{letter-spacing:0;text-transform:none;font-weight:500;font-size:12.5px}
.conds-list{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--border);border-radius:12px;overflow:hidden}

const svgLogo = (k, cls) => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${LOGO[k]}"/></svg>`;
function bankMark(c, mini){
  if (c.net === "amex") return `<span>${mini ? "Amex" : "American Express"}</span>`;
  const g = c.short === "HDFC" ? svgLogo("hdfc", "cc-logo") : c.short === "ICICI" ? svgLogo("icici", "cc-logo cc-logo--icici") : "";
  return g + `<span>${mini ? c.short : c.bank}</span>`;
}
function netHTML(n){
  if (n === "visa") return `<span class="net-visa" aria-label="Visa">${svgLogo("visa","net-svg")}</span>`;
  if (n === "mc") return `<span class="net-mc" aria-label="Mastercard"><i></i><i></i></span>`;
  if (n === "amex") return `<span class="net-amex" aria-label="American Express"><b>AMERICAN</b><b>EXPRESS</b></span>`;
  return `<span class="net-diners" aria-label="Diners Club">${svgLogo("diners","net-svg")}</span>`;
}
function cardHTML(id, opts){
  opts = opts || {};
  const c = C[id];
  return `<div class="cc ${opts.mini ? "mini" : ""} ${opts.cls || ""}" data-card="${id}" style="--bg:${c.bg};--art:${c.art};--fg:${c.fg};${opts.style || ""}" role="img" aria-label="${c.bank} ${c.name} card ending ${c.last4}">
    <span class="cc-glare"></span>
    <div class="cc-in">
      <div class="cc-top"><span class="cc-bank">${bankMark(c, opts.mini)}</span><span class="cc-name">${c.name}</span></div>
      <div class="cc-mid"><span class="cc-chip"></span><svg class="cc-nfc" viewBox="0 0 12 14" aria-hidden="true"><path d="M2 3.5c1.6 2 1.6 5 0 7M5 2c2.4 3 2.4 7 0 10M8 .8c3.2 3.8 3.2 8.6 0 12.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></div>
      <div class="cc-bot"><span class="cc-id"><span class="cc-num">•••• ${c.last4}</span><span class="cc-holder">Arjun Mehta</span></span>${netHTML(c.net)}</div>
    </div></div>`;
}
function otaHTML(id, s, extra){
  const st = s ? `style="--s:${s}px"` : "";
  const t = `title="${OTAS[id].name}" role="img" aria-label="${OTAS[id].name}"`;
  if (id === "mmt") return `<span class="ota ota--mmt ${extra||""}" ${st} ${t}><b>my</b></span>`;
  if (id === "ct") return `<span class="ota ota--ct ${extra||""}" ${st} ${t}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 13.1l4.6 4.5L19.6 5.6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
  if (id === "emt") return `<span class="ota ota--emt ${extra||""}" ${st} ${t}><svg viewBox="0 0 152 86" aria-hidden="true"><path d="M1 1 L151 12 L113 23 L32 37 Z" fill="#0BB5E0" stroke="#0BB5E0" stroke-width="2" stroke-linejoin="round"/><path d="M41 45 L113 23 L151 13 L77 85 Z" fill="#0BB5E0" stroke="#0BB5E0" stroke-width="2" stroke-linejoin="round"/><path d="M41 47 L54 60 L25 74 Z" fill="#0079B5" stroke="#0079B5" stroke-width="2" stroke-linejoin="round"/></svg></span>`;
  return `<span class="ota ota--yt ${extra||""}" ${st} ${t}><b>y</b></span>`;
}

/* ================= ROUTER ================= */
const app = document.getElementById("app");
function go(screen, opts){
  opts = opts || {};
  if (!opts.back && state.screen && state.screen !== screen) state.hist.push(state.screen);
  clearTimers();
  closeSheet(true);
  document.getElementById("layer").innerHTML = "";
  const old = app.firstElementChild;
  if (old && !reduce) { old.classList.add("leaving"); setTimeout(() => old.remove(), 180); }
  else if (old) old.remove();
  state.screen = screen;
  const el = document.createElement("main");
  el.className = "screen";
  el.dataset.screen = screen;
  el.innerHTML = SCREENS[screen].html();
  app.appendChild(el);
  document.body.classList.toggle("has-dock", screen === "add");
  const dock = document.getElementById("dock");
  dock.hidden = screen !== "add";
  if (screen !== "add") dock.innerHTML = "";
  window.scrollTo({ top: 0, behavior: "instant" });
  paint();
  SCREENS[screen].mount && SCREENS[screen].mount(el);
}
function back(){
  const prev = state.hist.pop();
  go(prev || "landing", { back: true });
}
function paint(){ if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 1.5 } }); }
function toast(msg){
  const t = document.getElementById("toast");
  t.innerHTML = icon("check") + msg; paint();
  t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

      const from = { x: box.width/2, y: (fan.length-1)*spread + fan[0].offsetHeight - 6 };
      svg.innerHTML = [...el.querySelectorAll(".viz-ota")].map(b => {
        const r = b.querySelector(".ota").getBoundingClientRect();
        const x = r.left - box.left + r.width/2, y = r.top - box.top;
        return `<path data-ota="${b.dataset.ota}" d="M${from.x} ${from.y} C ${from.x} ${(from.y+y)/2}, ${x} ${(from.y+y)/2}, ${x} ${y-4}"/>`;
      }).join("");
    };
    draw(); addEventListener("resize", draw, { once: true });
    const hl = ota => {
      const cards = ota ? new Set(OFFERS.filter(o => o.ota === ota).map(o => o.card)) : null;
      fan.forEach(c => { c.classList.toggle("dim", !!cards && !cards.has(c.dataset.card)); c.classList.toggle("hl", !!cards && cards.has(c.dataset.card)); });
      svg.querySelectorAll("path").forEach(p => { p.classList.toggle("on", p.dataset.ota === ota); p.classList.toggle("off", !!ota && p.dataset.ota !== ota); });
      el.querySelectorAll(".viz-ota").forEach(b => b.classList.toggle("on", b.dataset.ota === ota));
    };
    el.querySelectorAll(".viz-ota").forEach(b => {
      b.addEventListener("pointerenter", () => hl(b.dataset.ota));
      b.addEventListener("pointerleave", () => hl(null));
      b.addEventListener("focus", () => hl(b.dataset.ota));
      b.addEventListener("blur", () => hl(null));

  }
};

function flyToWallet(cc){
  if (reduce) return;
  const from = cc.getBoundingClientRect();
  const target = document.getElementById("dockStack") || document.getElementById("dock");
  const tr = target.getBoundingClientRect();
  const clone = cc.cloneNode(true);
  Object.assign(clone.style, { position:"fixed", left: from.left+"px", top: from.top+"px", width: from.width+"px", margin:0, zIndex:80, pointerEvents:"none", "--w": from.width+"px" });
  document.body.appendChild(clone);
  const tx = tr.right - from.left - from.width*0.5 + 4, ty = tr.top + 15 - from.top - from.height*0.5;
  clone.animate([
    { transform:"translate(0,0) scale(1) rotate(0)", offset:0 },
    { transform:`translate(${tx*0.35}px, ${ty*0.25 - 40}px) scale(.85) rotate(-6deg)`, offset:.35 },
    { transform:`translate(${tx}px, ${ty}px) scale(${46/from.width}) rotate(0)`, opacity:.9, offset:1 }

}

function cardStatus(id, res){
  const evs = res.list.filter(e => e.o.card === id);
  if (!evs.length) return { k: "none", t: "No flight offers", d: "Nothing on any platform right now" };
  if (res.rec && res.rec.o.card === id) return { k: "best", t: "Best for this flight", d: `Saves ${inr(res.rec.saving)} on ${OTAS[res.rec.o.ota].name}` };
  const use = evs.filter(e => e.status === "use").sort((a,b) => b.saving - a.saving)[0];
  if (use) return { k: "use", t: "Also works", d: `Saves ${inr(use.saving)} on ${OTAS[use.o.ota].name}` };
  const c = evs.find(e => e.status === "catch");
  if (c) return { k: "catch", t: "Has a catch", d: dayRange(c.o.bookDays) };
  return { k: "no", t: "Doesn't apply", d: evs[0].fails[0] };
}
