.ad-tag b{color:var(--ink);font-weight:600}
.ad-tag small{color:var(--ink-2);font-size:12px;white-space:nowrap}
@media (max-width:420px){ .ad-tag small{display:none} }
/* handoff content entrance */
.ho-body{animation:hoIn .5s 1.15s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes hoIn{from{opacity:0;transform:translateY(14px)}}
#hoCard{animation:hoFlip .9s 1.3s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes hoFlip{0%{transform:perspective(1000px) rotateY(-75deg) rotateX(12deg) translateY(30px);opacity:0}65%{transform:perspective(1000px) rotateY(8deg) rotateX(-4deg);opacity:1}100%{transform:none;opacity:1}}
.ho h1{margin-top:6px}
.ho-ready{text-transform:none;letter-spacing:0;font-size:13px}
/* 30 Sundays exclusive trip card */
.trip2{position:relative;display:block;width:100%;min-height:520px;border-radius:var(--r-card);overflow:hidden;text-align:left;color:#fff;border:1px solid var(--border);isolation:isolate}
.trip2 .scene{transition:transform 1.2s var(--ease)}
.trip2:hover .scene{transform:scale(1.04)}
.trip2-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,4,6,.15) 0%,rgba(4,4,6,.2) 35%,rgba(4,4,6,.88) 72%,rgba(4,4,6,.96) 100%)}
.trip2-in{position:relative;min-height:520px;display:flex;flex-direction:column;justify-content:space-between;padding:20px}
.trip2-top{display:flex;align-items:center;gap:10px;align-self:flex-start;padding:6px 14px 6px 12px;border-radius:9999px;background:rgba(4,4,6,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.trip2-top .logo30{height:24px}
.excl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:#ffe9c4}
.trip2-k{font-size:13px;font-weight:600;letter-spacing:-0.02em;color:var(--rec)}
.trip2 h3{font-family:var(--serif);font-weight:400;font-size:48px;line-height:1;letter-spacing:.01em;margin-top:8px;color:#fff}
.trip2-main > p{margin-top:10px;font-size:15px;color:var(--mist);max-width:36ch}
.trip2-perks{display:grid;gap:8px;margin-top:18px}
.trip2-perks > span{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mist)}
.trip2-perks b{color:#fff;font-weight:500}
.trip2-perks .cc{--w:42px;box-shadow:none;flex:none}
.trip2 .trip-go{position:static;margin-top:20px;display:inline-flex;height:44px;padding:0 18px;border-radius:9999px;background:#fff;color:#000;font-weight:500;font-size:14.5px;box-shadow:none}
@media (min-width:900px){
  .trip2{min-height:380px}
  .trip2-in{min-height:380px;padding:28px 32px}
  .trip2-scrim{background:linear-gradient(90deg,rgba(4,4,6,.96) 0%,rgba(4,4,6,.85) 38%,rgba(4,4,6,.2) 70%,rgba(4,4,6,0) 100%)}
  .trip2-main{max-width:440px}
  .trip2 h3{font-size:60px}
}
/* matching: progress lives with the numbers, the mesh stays clean */
.m-badge{display:none !important}
.m-prog{margin-top:22px}
.m-prog-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-2)}
.m-prog-h b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.m-bar{height:4px;border-radius:9999px;background:var(--border);margin-top:8px;overflow:hidden}
.m-bar i{display:block;height:100%;border-radius:9999px;background:var(--gilded);transition:width .45s var(--ease)}
.m-count{margin-top:16px}
/* landing atmosphere */
main.screen[data-screen="landing"]{position:relative;isolation:isolate}
main.screen[data-screen="landing"]::before{content:"";position:absolute;left:0;right:0;top:0;height:min(1000px,100%);z-index:-1;pointer-events:none;
  background:radial-gradient(48% 42% at 78% 30%, rgba(204,145,102,.18), transparent 72%),radial-gradient(40% 35% at 8% 4%, rgba(255,240,204,.07), transparent 70%)}
main.screen[data-screen="landing"]::after{content:"";position:absolute;left:0;right:0;top:0;height:min(900px,100%);z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.075) 1px, transparent 1.3px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(70% 60% at 70% 30%,#000 0%,rgba(0,0,0,.4) 55%,transparent 85%);mask-image:radial-gradient(70% 60% at 70% 30%,#000 0%,rgba(0,0,0,.4) 55%,transparent 85%)}

/* handoff: card flies into the logo, then the intro rises and fades */
.ho-anim{animation:hoUp .45s 1.05s cubic-bezier(.5,0,.75,0) forwards}
@keyframes hoUp{to{opacity:0;transform:translateY(-28px);height:0;margin:0}}
.remember{position:relative}

/* ================= LIGHT THEME (same tokens, AA-checked) ================= */
:root[data-theme="light"]{
  color-scheme: light;
  --canvas:#f6f6f3; --surface:#ffffff; --soft:#efefeb; --border:#e3e3de; --border-2:#cfcfc9;
  --ink:#0b0b0d; --body:#25262c; --ink-2:#5b5e69; --muted:#9a9ca5; --steel:#6e717c; --mist:#4a4d57;
  --action:#0b0b0d; --on-action:#ffffff;
  --rec:#9a5a2a; --rec-soft:rgba(154,90,42,.08);
  --pos:#2b7449; --pos-soft:rgba(43,116,73,.08);
  --warn:#8a5800; --warn-soft:rgba(138,88,0,.07); --danger:#ad3528; --danger-soft:rgba(173,53,40,.07);
  --gilded: linear-gradient(103deg,#7a5a20,#b8892f 40%,#6e5019 70%,#9a7330);
}
:root[data-theme="light"] .btn:hover{background:#2a2b31}
:root[data-theme="light"] .date.on{color:#fff}
:root[data-theme="light"] .date.on small,:root[data-theme="light"] .date.on span{color:rgba(255,255,255,.78)}
:root[data-theme="light"] .seg button[aria-pressed="true"]{color:#fff}
:root[data-theme="light"] .toast{color:#fff}
:root[data-theme="light"] .evt-btn b{color:#fff}
:root[data-theme="light"] .ig{background:#fff;border-color:#dbdbdb}
:root[data-theme="light"] .ig-cap b,:root[data-theme="light"] .ig-who b{color:var(--ink)}
:root[data-theme="light"] .ig-cta{background:var(--ink);color:#fff}
:root[data-theme="light"] .ig-cta:hover{background:#2a2b31}
:root[data-theme="light"] .ig-ava .brand-mark span:last-child{background:var(--ink)}
:root[data-theme="light"] .ad-tag{background:rgba(255,255,255,.94);border-color:var(--border)}
:root[data-theme="light"] .dock{background:rgba(246,246,243,.92)}
:root[data-theme="light"] .catch-line{color:#5e400f}
:root[data-theme="light"] .catchc{border-color:rgba(138,88,0,.22)}
:root[data-theme="light"] .match-board line.win{stroke:#7a5a20}
:root[data-theme="light"] .ota{box-shadow:inset 0 0 0 1px var(--border)}
:root[data-theme="light"] .ota--mmt,:root[data-theme="light"] .ota--ct,:root[data-theme="light"] .ota--yt{box-shadow:none}
:root[data-theme="light"] .rec,:root[data-theme="light"] .alt,:root[data-theme="light"] .also-row,:root[data-theme="light"] .miss,:root[data-theme="light"] .do-box,:root[data-theme="light"] .remember-box,:root[data-theme="light"] .g-cards{box-shadow:0 1px 2px rgba(17,17,17,.04)}
:root[data-theme="light"] .ck-dot{box-shadow:inset 0 0 0 1px rgba(43,116,73,.45)}
:root[data-theme="light"] .head--unknown .hd-i{box-shadow:inset 0 0 0 1px rgba(138,88,0,.45)}
:root[data-theme="light"] .head--choice .hd-i{box-shadow:inset 0 0 0 1px rgba(74,77,87,.4)}
:root[data-theme="light"] .head--fail .hd-i{box-shadow:inset 0 0 0 1px rgba(173,53,40,.45)}
:root[data-theme="light"] .cd--unknown{background:rgba(138,88,0,.035)}
:root[data-theme="light"] .tip{border-color:rgba(154,90,42,.25)}
:root[data-theme="light"] .ws-dot{box-shadow:0 0 0 2px #fff}
:root[data-theme="light"] .sheet-bg{background:rgba(11,11,13,.35)}
:root[data-theme="light"] main.screen::after{background-image:radial-gradient(rgba(11,11,13,.075) 1px, transparent 1.3px)}
:root[data-theme="light"] main.screen[data-screen="home"]::before,:root[data-theme="light"] main.screen[data-screen="detail"]::before,:root[data-theme="light"] main.screen[data-screen="offers"]::before,:root[data-theme="light"] main.screen[data-screen="landing"]::before{background:radial-gradient(55% 38% at 82% 0%, rgba(154,90,42,.12), transparent 72%),radial-gradient(45% 30% at 6% 8%, rgba(184,137,47,.08), transparent 70%)}
:root[data-theme="light"] .rec-visual{background:radial-gradient(110% 70% at 50% 0%, rgba(154,90,42,.07) 0%, transparent 70%), var(--soft)}
:root[data-theme="light"] .l-on-dark{display:none}
:root:not([data-theme="light"]) .l-on-light{display:none}
/* theme toggle */
.theme-btn{position:fixed;right:0;top:calc(38% - 42px);z-index:70;height:34px;width:42px;padding:0 0 0 4px;border-radius:9px 0 0 9px;border:1px solid var(--border-2);border-right:0;background:var(--soft);color:var(--body);display:grid;place-items:center;font-size:16px}
.theme-btn:hover{color:var(--ink)}
.theme-btn .i-sun{display:none}
:root[data-theme="light"] .theme-btn .i-sun{display:block}
:root[data-theme="light"] .theme-btn .i-moon{display:none}
html{transition:background-color .3s}
body,.rec,.alt,.cd,.btn,.iconbtn,.route-pill{transition:background-color .25s,border-color .25s,color .25s}

/* AA: text never uses the decorative muted grey */
.land-foot,.wal-tip,.pv-fine,.pay-net s{color:var(--ink-2)}
.theme-btn:focus-visible,.evt-btn:focus-visible{outline:2px solid var(--rec);outline-offset:2px}

const C = Object.fromEntries(CARDS.map(c => [c.id, c]));
const D = (m, d) => new Date(2026, m - 1, d);
const DAYN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const CITIES = { DEL:"Delhi", BOM:"Mumbai", BLR:"Bengaluru", GOI:"Goa", HYD:"Hyderabad", CCU:"Kolkata", MAA:"Chennai" };
const AIRLINES = {
  "6E": { name:"IndiGo",    color:"#1b2a8f", url:"https://www.goindigo.in" },
  "AI": { name:"Air India", color:"#c8102e", url:"https://www.airindia.com" },
  "QP": { name:"Akasa Air", color:"#e8590c", url:"https://www.akasaair.com" },
  "SG": { name:"SpiceJet",  color:"#c4161c", url:"https://www.spicejet.com" }
};
const rk = (a, b) => [a, b].sort().join("-");
const BASE = { "BOM-DEL":5600, "BLR-DEL":7900, "BLR-GOI":3300, "BLR-BOM":4600, "CCU-DEL":6100, "BOM-GOI":3500, "DEL-HYD":5900, "BOM-CCU":6800, "BLR-MAA":2900, "BLR-HYD":3100, "DEL-GOI":6600, "DEL-MAA":7400, "BOM-HYD":4200, "BOM-MAA":4800, "BLR-CCU":7600 };
const CARRIERS = { "BOM-DEL":["6E","AI","QP","SG"], "BLR-GOI":["6E","QP"], "BLR-DEL":["6E","AI","QP"], "BLR-BOM":["6E","AI","QP"] };
const MULT = { "6E":1, "AI":1.11, "QP":0.96, "SG":1.03 };
const daysAhead = d => Math.round((d - TODAY) / 864e5);
/* Mock fare model: route base, closer dates cost more, Fri/Sun dearer, Tue/Wed cheaper. */
function faresFor(r){
  const k = rk(r.from, r.to), base = BASE[k] || 5200, d = daysAhead(r.date), wd = r.date.getDay();
  let f = 1 + Math.max(0, 10 - d) * 0.035;
  f *= (wd === 5 || wd === 0) ? 1.08 : (wd === 2 || wd === 3) ? 0.95 : 1;
  return (CARRIERS[k] || ["6E","AI","SG"]).map(a => ({ air: a, fare: Math.round(base * f * MULT[a] / 10) * 10 * r.pax })).sort((x, y) => x.fare - y.fare);
}
/* Offers: every condition that can block a user is modelled, not just the headline. */
const OFFERS = [
  { id:"o1",  card:"hdfc-regalia", ota:"mmt", kind:"instant",  pct:12, cap:1200, min:5000, ends:D(11,15), excl:["QP"], monthly:true, code:"HDFCFLY" },
  { id:"o2",  card:"axis-atlas",   ota:"ct",  kind:"instant",  pct:15, cap:1500, min:6000, ends:D(11,20), bookDays:[2] },
  { id:"o3",  card:"sbi-cashback", ota:"emt", kind:"instant",  pct:12, cap:1800, min:7500, ends:D(11,30), emi:true, emiFee:199 },
  { id:"o4",  card:"icici-amazon", ota:"yt",  kind:"instant",  pct:8,  cap:800,  min:4000, ends:D(11,12), only:["AI","SG"] },
  { id:"o5",  card:"amex-mrcc",    ota:"mmt", kind:"flat",     flat:750, cap:750, min:8000, ends:D(10,31), bookDays:[6,0] },
  { id:"o6",  card:"hdfc-regalia", ota:"ct",  kind:"instant",  pct:10, cap:1000, min:7000, ends:D(10,12) },
  { id:"o7",  card:"icici-amazon", ota:"mmt", kind:"cashback", pct:5,  cap:400,  min:4000, ends:D(12,31), creditDays:30 },
  { id:"o8",  card:"axis-atlas",   ota:"mmt", kind:"instant",  pct:8,  cap:1000, min:5000, ends:D(11,15), newUser:true },
  { id:"o9",  card:"sbi-cashback", ota:"yt",  kind:"instant",  pct:6,  cap:700,  min:4500, ends:D(11,25), bookDays:[1,2,3,4] },
  { id:"o10", card:"amex-mrcc",    ota:"ct",  kind:"instant",  pct:10, cap:1500, min:9000, ends:D(11,30), intl:true },
  { id:"o11", card:"hdfc-millennia", ota:"emt", kind:"instant", pct:10, cap:800, min:4500, ends:D(11,30) },
  { id:"o12", card:"axis-magnus",  ota:"ct",  kind:"instant",  pct:12, cap:2000, min:12000, ends:D(11,30) }
];
const DEFAULT_WALLET = ["hdfc-regalia","axis-atlas","sbi-cashback","icici-amazon","amex-mrcc"];

/* ================= ENGINE ================= */
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const k = n => n >= 1000 ? "₹" + (Math.round(n / 100) / 10).toString().replace(/\.0$/,"") + "k" : inr(n);
const fmtDate = d => d.getDate() + " " + d.toLocaleString("en-GB",{month:"short"});
const fmtDateLong = d => d.getDate() + " " + d.toLocaleString("en-GB",{month:"long"});
const fmtDay = d => DAYN[d.getDay()] + " " + fmtDate(d);
const benefit = (o, s) => s < o.min ? 0 : (o.kind === "flat" ? o.flat : Math.min(Math.round(o.pct/100*s), o.cap));
const headline = o => o.kind === "flat" ? inr(o.flat) : o.pct + "%";
const unitLabel = o => o.kind === "flat" ? "flat off" : o.kind === "cashback" ? "cashback" : "instant off";
const longLabel = o => o.kind === "flat" ? "Flat discount" : o.kind === "cashback" ? "Cashback" : "Instant discount";
const maxB = o => o.kind === "flat" ? o.flat : o.cap;
const banner = o => o.kind === "flat" ? `${inr(o.flat)} off` : `${o.pct}% ${o.kind === "cashback" ? "cashback" : "off"}, up to ${inr(o.cap)}`;
const airNames = list => list.map(a => AIRLINES[a].name);
const joinAnd = arr => arr.length < 2 ? arr.join("") : arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];
function dayRange(days){
  const s = days.slice().sort((a,b) => a - b);
  if (s.length === 1) return DAYL[s[0]] + " bookings only";
  if (s.join() === "0,6") return "Weekend bookings only";
  const contiguous = s.every((d, i) => i === 0 || d === s[i-1] + 1);
  return contiguous ? `${DAYN[s[0]]} to ${DAYN[s[s.length-1]]} bookings only` : s.map(d => DAYN[d]).join(", ") + " bookings only";
}
function nextBookDay(days){
  for (let i = 1; i <= 7; i++) { const d = new Date(TODAY); d.setDate(d.getDate() + i); if (days.includes(d.getDay())) return d; }
  return null;
}
/* Certainty: what we cannot verify lowers confidence instead of being hidden. */
const CERT = { monthly: .85, newUser: .4, emi: .6, cashback: .92 };
const certLabel = c => c >= .95 ? "Ready to use" : c >= .8 ? "1 thing to check" : "Check conditions";
const certKey = c => c >= .95 ? "sure" : c >= .8 ? "likely" : "depends";

/* Evaluate one offer against the route: returns status, the airline we would book, the real saving and every condition. */
function evaluate(o, r, fares){
  const conds = [];
  const cheapest = fares[0].fare;
  let fails = [], catchDay = null, cert = 1;
  // airlines
  const onRoute = fares.map(f => f.air);
  let allowed = onRoute.filter(a => (!o.only || o.only.includes(a)) && !(o.excl || []).includes(a));
  if (o.only) conds.push({ sh: `${joinAnd(airNames(o.only))} only`, s: allowed.length ? "pass" : "fail", t: `${joinAnd(airNames(o.only))} only`, d: allowed.length ? `Flies this route` : `Neither flies ${r.from} to ${r.to}` });
  else if (o.excl) conds.push({ sh: `Not ${joinAnd(airNames(o.excl))}`, s: allowed.length ? "pass" : "fail", t: `Not valid on ${joinAnd(airNames(o.excl))}`, d: allowed.length ? `${joinAnd(airNames(allowed))} work` : "No other airline flies this route" });
  else conds.push({ sh: "Any airline", s: "pass", t: "Any airline", d: "No airline exclusions" });
  if (!allowed.length) fails.push(o.only ? `Only ${joinAnd(airNames(o.only))}, which don't fly this route` : `Excludes every airline on this route`);
  // international
  if (o.intl) { conds.push({ s: "fail", t: "International flights only", d: "This is a domestic route" }); fails.push("International flights only"); }
  // pick the airline with the lowest price after the offer
  let best = null;
  fares.filter(f => allowed.includes(f.air)).forEach(f => {
    const sv = Math.max(0, benefit(o, f.fare) - (o.emi && benefit(o, f.fare) ? o.emiFee : 0));
    const net = f.fare - sv;
    if (!best || net < best.net) best = { air: f.air, fare: f.fare, saving: sv, net };
  });
  const topFare = allowed.length ? Math.max(...fares.filter(f => allowed.includes(f.air)).map(f => f.fare)) : 0;
  // minimum spend
  if (o.min) {
    const ok = best && best.saving > 0;
    conds.push({ sh: `Min ${k(o.min)}`, s: ok ? "pass" : "fail", t: `Minimum booking ${inr(o.min)}`, d: ok ? `Your fare is about ${inr(best.fare)}${r.pax > 1 ? ` for ${r.pax}` : ""}` : `Fares on this route are about ${inr(allowed.length ? Math.min(...fares.filter(f => allowed.includes(f.air)).map(f => f.fare)) : cheapest)}` });
    if (!ok && allowed.length && !o.intl) fails.push(`Needs ${inr(o.min)}+. Fare is about ${inr(Math.min(...fares.filter(f => allowed.includes(f.air)).map(f => f.fare)))}`);
  }
  // booking days
  if (o.bookDays) {
    const today = o.bookDays.includes(TODAY.getDay());
    const nd = today ? null : nextBookDay(o.bookDays);
    conds.push({ sh: "Bookable today", s: today ? "pass" : "fail", t: dayRange(o.bookDays), d: today ? `Today is ${DAYL[TODAY.getDay()]}` : `Earliest: ${fmtDay(nd)}. Fares may change by then` });
    if (!today) catchDay = nd;
  }
  // validity
  conds.push({ sh: `Until ${fmtDate(o.ends)}`, s: "pass", t: `Book by ${fmtDateLong(o.ends)}`, d: `${daysAhead(o.ends)} days left` });
  // EMI
  if (o.emi) { conds.push({ s: "choice", t: "Only if you pay in EMI", d: `3+ month EMI. The ${inr(o.emiFee)} fee is already deducted` }); cert *= CERT.emi; }
  // monthly cap

/* ================= ROUTER ================= */
const app = document.getElementById("app");
function go(screen, opts){
  opts = opts || {};
  if (!opts.back && state.screen && state.screen !== screen) state.hist.push(state.screen);
  clearTimers();
  closeSheet(true);
  document.getElementById("layer").innerHTML = "";
  const old = app.firstElementChild;
  if (old && !reduce) { old.classList.add("leaving"); setTimeout(() => old.remove(), 180); }
  else if (old) old.remove();
  state.screen = screen;
  const el = document.createElement("main");
  el.className = "screen";
  el.dataset.screen = screen;
  el.innerHTML = SCREENS[screen].html();
  app.appendChild(el);
  document.body.classList.toggle("has-dock", screen === "add");
  const dock = document.getElementById("dock");
  dock.hidden = screen !== "add";
  if (screen !== "add") dock.innerHTML = "";
  window.scrollTo({ top: 0, behavior: "instant" });
  paint();
  SCREENS[screen].mount && SCREENS[screen].mount(el);
}
function back(){
  const prev = state.hist.pop();
  go(prev || "landing", { back: true });
}
function paint(){ if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 1.5 } }); }
function toast(msg){
  const t = document.getElementById("toast");
  t.innerHTML = icon("check") + msg; paint();
  t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

SCREENS.ad = {
  html: () => `
  <div class="ad-stage">
    <div class="ad-ctx">Ad preview · Instagram feed</div>
    <article class="ig">
      <header class="ig-head">
        <span class="ig-ava"><span class="brand-mark" aria-hidden="true"><span></span><span></span></span></span>
        <span class="ig-who"><b>cardpick</b><small>Sponsored</small></span>
        ${icon("more-horizontal")}
      </header>
      <div class="ig-media">
        <div class="ad-copy">
          <h2>Your credit card already has a <em>flight discount.</em></h2>
          <p>Do you know which card, and where?</p>
        </div>
        <div class="ad-vis">
          <div class="ad-tag" id="adTag" aria-live="off"></div>
          <div class="ad-fan" id="adFan">${DEFAULT_WALLET.map(id => cardHTML(id)).join("")}</div>
        </div>
        <div class="ad-fine">${icon("lock")} No card number required.</div>
      </div>
      <button class="ig-cta" type="button" data-action="ad-cta">Find my card's offer ${icon("arrow-right")}</button>
      <div class="ig-icons">${icon("heart")}${icon("message-circle")}${icon("send")}<span>${icon("bookmark")}</span></div>
      <p class="ig-cap"><b>cardpick</b> Flight offers on HDFC, Axis, SBI, ICICI and Amex cards, checked against your route.</p>
    </article>
  </div>`,
  mount(el){
    track("ad_viewed");
    const cards = [...el.querySelectorAll("#adFan .cc")];
    const angles = [-16,-8,0,8,16];
    let active = 2;
    const apply = () => cards.forEach((c,i) => {
      const up = i === active;
      c.classList.toggle("up", up);
      c.style.zIndex = up ? 10 : i;
      c.style.transform = `rotate(${angles[i]}deg) translateY(${up ? -22 : 0}px)`;
    });
    const tag = el.querySelector("#adTag");
    const showTag = () => {
      const id = cards[active].dataset.card;
      const o = OFFERS.filter(x => x.card === id).sort((a,b) => maxB(b) - maxB(a))[0];
      if (!o) return;
      tag.innerHTML = `${otaHTML(o.ota, 26)}<span><b>${o.kind === "flat" ? inr(o.flat) + " off" : o.pct + "% off"}</b> flights on ${OTAS[o.ota].name}</span><small>with ${cardFull(id)}</small>`;
      paint();
      if (!reduce) tag.animate([{ opacity:0, transform:"translateY(6px) scale(.97)" },{ opacity:1, transform:"none" }], { duration:320, easing:"cubic-bezier(.2,.8,.2,1)" });
    };
    apply(); showTag();
    if (!reduce) every(() => { active = (active + 1) % cards.length; apply(); showTag(); }, 2000);
  }
};

    const narrow = innerWidth < 900;

    fan.forEach((c,i) => { c.style.top = (i*spread) + "px"; c.style.transform = `translateX(${(i-2)*(narrow?10:16)}px) rotate(${(i-2)*-2.5}deg)`; c.style.zIndex = i; });
    const svg = el.querySelector("#vizPaths");
    const draw = () => {
      const box = el.querySelector("#viz").getBoundingClientRect();
      const from = { x: box.width/2, y: (fan.length-1)*spread + fan[0].offsetHeight - 6 };
      svg.innerHTML = [...el.querySelectorAll(".viz-ota")].map(b => {
        const r = b.querySelector(".ota").getBoundingClientRect();
        const x = r.left - box.left + r.width/2, y = r.top - box.top;
        return `<path data-ota="${b.dataset.ota}" d="M${from.x} ${from.y} C ${from.x} ${(from.y+y)/2}, ${x} ${(from.y+y)/2}, ${x} ${y-4}"/>`;
      }).join("");
    };
    draw(); addEventListener("resize", draw, { once: true });
    const hl = ota => {
      const cards = ota ? new Set(OFFERS.filter(o => o.ota === ota).map(o => o.card)) : null;
      fan.forEach(c => { c.classList.toggle("dim", !!cards && !cards.has(c.dataset.card)); c.classList.toggle("hl", !!cards && cards.has(c.dataset.card)); });
      svg.querySelectorAll("path").forEach(p => { p.classList.toggle("on", p.dataset.ota === ota); p.classList.toggle("off", !!ota && p.dataset.ota !== ota); });
      el.querySelectorAll(".viz-ota").forEach(b => b.classList.toggle("on", b.dataset.ota === ota));
    };
    el.querySelectorAll(".viz-ota").forEach(b => {
      b.addEventListener("pointerenter", () => hl(b.dataset.ota));
      b.addEventListener("pointerleave", () => hl(null));
      b.addEventListener("focus", () => hl(b.dataset.ota));
      b.addEventListener("blur", () => hl(null));
      b.addEventListener("click", () => hl(b.dataset.ota));
    });
  }
};

function toggleCard(btn){
  const id = btn.dataset.id;

function flyToWallet(cc){
  if (reduce) return;
  const from = cc.getBoundingClientRect();
  const target = document.getElementById("dockStack") || document.getElementById("dock");
  const tr = target.getBoundingClientRect();
  const clone = cc.cloneNode(true);
  Object.assign(clone.style, { position:"fixed", left: from.left+"px", top: from.top+"px", width: from.width+"px", margin:0, zIndex:80, pointerEvents:"none", "--w": from.width+"px" });
  document.body.appendChild(clone);
  const tx = tr.right - from.left - from.width*0.5 + 4, ty = tr.top + 15 - from.top - from.height*0.5;
  clone.animate([
    { transform:"translate(0,0) scale(1) rotate(0)", offset:0 },
    { transform:`translate(${tx*0.35}px, ${ty*0.25 - 40}px) scale(.85) rotate(-6deg)`, offset:.35 },
    { transform:`translate(${tx}px, ${ty}px) scale(${46/from.width}) rotate(0)`, opacity:.9, offset:1 }
  ], { duration: 460, easing:"cubic-bezier(.3,.7,.2,1)" }).onfinish = () => clone.remove();
}

        : `<div class="next-in do-box"><div class="do-main">${airChip(res.cheapest.air)}<b>Book the cheapest fare, about ${inr(res.cheapest.fare)}</b></div><p>Pay with any card.</p><div class="do-actions"><button class="btn" type="button" data-action="home">See why ${icon("arrow-right")}</button></div></div>`;

  }
};

/* ---- 30 Sundays: story, preferences, preview ---- */

  ["beach","Beach & nothing else","radial-gradient(60% 60% at 75% 35%, #ffe2a8, transparent 55%), linear-gradient(180deg,#5fa7c4 0%,#9fd3d9 50%,#e9d6b0 51%,#d8c08f 100%)"],

function openTrip(){

  layer.innerHTML = `<div class="story" id="story" role="dialog" aria-modal="true" aria-label="Bali for two">

function closeLayer(){ document.getElementById("layer").innerHTML = ""; document.body.style.overflow = ""; }
function openPrefs(step){
  const layer = document.getElementById("layer");
  const t = state.trip;
  let inner;
  if (step === 1) inner = `<div class="label">Step 1 of 2</div><h2>What's your kind of getaway?</h2>
      <div class="choices">${VIBES.map(([id,l,bg]) => `<button type="button" class="choice ${t.vibe === id ? "sel" : ""}" data-action="vibe" data-id="${id}" aria-pressed="${t.vibe === id}"><span class="bg" style="background:${bg}"></span><span>${l.toUpperCase()}</span><span class="ck">${icon("check")}</span></button>`).join("")}</div>`;
  else if (step === 2) inner = `<div class="label">Step 2 of 2</div><h2>What would you optimize?</h2>

  else inner = `<div class="gen"><div><h2 style="font-size:26px">Shaping your Bali trip</h2><p>Matching your pace to your card benefits</p><div class="gen-bar"><i></i></div></div></div>`;
  layer.innerHTML = `<div class="prefs" role="dialog" aria-modal="true" aria-label="Trip preferences"><div class="prefs-in">
    <div class="story-top" style="color:var(--ink)"><button class="iconbtn" type="button" data-action="${step === 1 ? "back-story" : "prefs-back"}" aria-label="Back">${icon("arrow-left")}</button><span class="l-on-dark">${logo30()}</span><span class="l-on-light">${logo30("dark")}</span><span style="width:40px"></span></div>

  paint();

  if (step === 3) setTimeout(() => { track("trip_preview_generated", { vibe: t.vibe, optimize: t.opt }); openPreview(); }, reduce ? 50 : 1500);

      <div class="story-in" style="position:relative;padding-bottom:0"><div class="story-top">${logo30()}<button class="iconbtn" type="button" data-action="close-story" aria-label="Close">${icon("x")}</button></div></div>

/* ================= ACTIONS ================= */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b) return;
  const a = b.dataset.action, id = b.dataset.id;
  const rs = () => SCREENS.route.redraw && SCREENS.route.redraw();
  switch (a) {
    case "ad-cta": track("ad_cta_clicked"); go("landing"); break;
    case "landing-cta": track("landing_cta_clicked"); go("route"); break;
    case "back": back(); break;
    case "home": freshRes(); go("home"); break;
    case "toggle-card": toggleCard(b); break;
    case "find": if (!state.wallet.length) return; track("wallet_completed", { cards: state.wallet.length }); go("matching"); break;
    case "go-add": closeSheet(true); go("add"); break;
    case "edit-route": go("route"); break;
    case "swap": { const r = state.route; [r.from, r.to] = [r.to, r.from]; document.getElementById("rtFrom").value = r.from; document.getElementById("rtTo").value = r.to; rs(); break; }
    case "quick-route": state.route.from = b.dataset.from; state.route.to = b.dataset.to; document.getElementById("rtFrom").value = state.route.from; document.getElementById("rtTo").value = state.route.to; rs(); break;
    case "date": state.route.date = new Date(+b.dataset.t); rs(); break;
    case "pax": state.route.pax = Math.min(6, Math.max(1, state.route.pax + (+b.dataset.d))); document.getElementById("paxN").textContent = state.route.pax; break;
    case "route-go": track("route_selected", { route: routeLabel(state.route), date: fmtDay(state.route.date), pax: state.route.pax }); go(state.wallet.length ? "matching" : "add"); break;
    case "card-sheet": openCardSheet(id); break;
    case "wsel": {
      if (walletSel(state.res) === id) { openCardSheet(id); break; }
      state.wsel = id; track("card_filter_changed", { card: id });
      const wl = document.getElementById("wallet");
      const before = {}; wl.querySelectorAll(".wslot").forEach(w => before[w.dataset.slot] = w.getBoundingClientRect());
      wl.innerHTML = walletStackHTML(state.res); paint();
      if (!reduce) wl.querySelectorAll(".wslot").forEach(w => {
        const a = before[w.dataset.slot], b2 = w.getBoundingClientRect(); if (!a) return;
        const dx = a.left - b2.left, dy = a.top - b2.top;
        const front = w.dataset.slot === id;
        w.animate(front ? [{ transform:`translate(${dx}px,${dy}px)` },{ transform:`translate(${dx*0.4}px,${dy*0.4 - 24}px) scale(1.04)`, offset:.45 },{ transform:"none" }]
                        : [{ transform:`translate(${dx}px,${dy}px)` },{ transform:"none" }], { duration: front ? 520 : 420, easing:"cubic-bezier(.2,.8,.2,1)" });
      });
      const d = document.getElementById("wsDetail"); d.innerHTML = wsDetailHTML(id, state.res); paint();
      if (!reduce) d.animate([{ opacity:0, transform:"translateY(6px)" },{ opacity:1, transform:"none" }], { duration:260, easing:"cubic-bezier(.2,.8,.2,1)" });
      break; }
    case "remove-card":
      state.wallet = state.wallet.filter(x => x !== id); store.set("wallet", state.wallet);
      track("card_removed", { card: id }); closeSheet(true);
      if (!state.wallet.length) { go("add"); break; }
      freshRes(); go("home"); toast(`${cardFull(id)} removed`); break;
    case "close-sheet": closeSheet(); break;
    case "all-offers": go("offers"); break;
    case "cat": state.cat = b.dataset.v; document.querySelectorAll('[data-action="cat"]').forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === state.cat))); drawRows(); break;
    case "open-offer": closeSheet(true); state.sel = evalById(id); track("offer_selected", { offer: id, status: state.sel.status, from: state.screen }); go("detail"); break;
    case "use": state.sel = evalById(id); track("offer_selected", { offer: id, cta: "use" }); go("handoff"); break;
    case "use-instead": state.sel = evalById(id); track("alternative_offer_selected", { offer: id }); go("handoff"); break;
    case "remind": track("reminder_set", { offer: id }); toast(`We'll remind you on ${fmtDay(state.sel.catchDay)}`); break;
    case "copy": {
      const txt = offerText(state.sel);
      track("offer_details_copied", { offer: state.sel.o.id });
      const done = () => toast("Offer details copied");
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done)); else fallbackCopy(txt, done);
      break; }
    case "redirect": track("ota_redirect_clicked", { offer: state.sel.o.id, ota: state.sel.o.ota }); go("redirect"); break;
    case "come-back": expire(state.sel); break;
    case "alert": state.alert = !state.alert; track("offer_alert_toggled", { on: state.alert });
      b.innerHTML = `${icon(state.alert ? "bell-ring" : "bell")} ${state.alert ? "We'll alert you" : "Alert me if an offer appears"}`; b.setAttribute("aria-pressed", String(state.alert)); paint();
      if (state.alert) toast(`We'll tell you if an offer appears for ${routeLabel(state.route)}`); break;
    case "airline-out": track("airline_direct_clicked", { airline: state.res.cheapest.air }); break;
    case "set-pax": state.route.pax = +b.dataset.n; track("travellers_changed", { pax: state.route.pax, from: "no_offer_tip" }); go("matching"); break;
    case "open-trip": openTrip(); break;
    case "close-story": closeLayer(); break;
    case "build-trip": openPrefs(1); break;
    case "back-story": openTrip(); break;
    case "prefs-back": openPrefs(1); break;
    case "vibe": state.trip.vibe = id; track("trip_preference_selected", { getaway: id }); openPrefs(1); break;
    case "opt": state.trip.opt = id; track("trip_preference_selected", { optimize: id }); openPrefs(2); break;
    case "prefs-next": openPrefs(2); break;
    case "prefs-gen": openPrefs(3); break;
    case "go-30s": track("30sundays_redirect_clicked", { vibe: state.trip.vibe, optimize: state.trip.opt }); toast("This is where the 30 Sundays planner opens"); break;
    case "save-idea": state.trip.saved = !state.trip.saved; openPreview(); if (state.trip.saved) toast("Saved to your ideas"); break;
    case "demo-restart": document.getElementById("evt").classList.remove("show"); closeLayer(); state.hist = []; state.expired = []; go("ad"); break;
    case "demo-none": case "demo-expire": {
      document.getElementById("evt").classList.remove("show"); closeLayer();
      if (!state.wallet.length) { state.wallet = DEFAULT_WALLET.slice(); store.set("wallet", state.wallet); }
      if (a === "demo-none") { state.route = { from: "BLR", to: "GOI", date: D(10,16), pax: 1 }; go("matching"); break; }
      const res = freshRes(); if (res.rec) expire(res.rec); else go("home"); break; }
  }
});
function expire(ev){
  if (!state.expired.includes(ev.o.id)) state.expired.push(ev.o.id);
  state.deadEval = ev;
  freshRes();
  go("recovery");
}
function fallbackCopy(txt, done){
  const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e) { toast("Select and copy the details above"); }
  ta.remove();
}
/* 3D card tilt: pointer position drives rotateX/Y and the glare highlight */
let tiltRaf = 0;
document.addEventListener("pointermove", e => {
  if (reduce || e.pointerType === "touch") return;
  const w = e.target.closest && e.target.closest("[data-tilt]"); if (!w) return;
  const cc = w.querySelector(".cc"); if (!cc) return;
  const r = cc.getBoundingClientRect();
  const px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), py = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  cancelAnimationFrame(tiltRaf);
  tiltRaf = requestAnimationFrame(() => {
    cc.style.setProperty("--rx", ((0.5 - py) * 18).toFixed(2) + "deg");
    cc.style.setProperty("--ry", ((px - 0.5) * 24).toFixed(2) + "deg");
    cc.style.setProperty("--gx", (px * 100).toFixed(1) + "%");
    cc.style.setProperty("--gy", (py * 100).toFixed(1) + "%");
    w.classList.add("tilting");
  });
});
document.addEventListener("pointerout", e => {
  const w = e.target.closest && e.target.closest("[data-tilt]"); if (!w || (e.relatedTarget && w.contains(e.relatedTarget))) return;
  const cc = w.querySelector(".cc"); if (!cc) return;
  cc.style.setProperty("--rx", "0deg"); cc.style.setProperty("--ry", "0deg");
  w.classList.remove("tilting");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); if (document.querySelector(".story,.prefs")) closeLayer(); document.getElementById("evt").classList.remove("show"); } });
document.getElementById("evtBtn").addEventListener("click", () => document.getElementById("evt").classList.toggle("show"));
document.getElementById("evtClose").addEventListener("click", () => document.getElementById("evt").classList.remove("show"));

/* theme: viewer's explicit choice or saved preference, dark by default */
(function initTheme(){
  const root = document.documentElement, btn = document.getElementById("themeBtn");
  const saved = store.get("theme", null);
  const set = t => { root.dataset.theme = t; const light = t === "light"; btn.setAttribute("aria-pressed", String(light)); btn.setAttribute("aria-label", light ? "Switch to dark mode" : "Switch to light mode"); btn.title = btn.getAttribute("aria-label"); };
  set(saved || root.dataset.theme || "dark");
  btn.addEventListener("click", () => { const t = root.dataset.theme === "light" ? "dark" : "light"; set(t); store.set("theme", t); track("theme_changed", { theme: t }); });
})();
renderEvents();
go("ad");
if (!window.lucide) window.addEventListener("load", paint);
})();
